<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constant Velocity Showdown</title>

<style>
/* Layout: a classroom whiteboard. Category magnets across the top, a 4x4 tile board, a team scoreboard tray along the bottom.
   Deliberately single-theme (light) because it is projected in a lit room. */
:root{
  --board:#fbfcfd;         /* whiteboard surface */
  --grid:#e6ebf0;          /* faint graph-paper grid */
  --ink:#1d232b;           /* black marker */
  --ink-soft:#56606c;
  --blue:#1f5fbf;          /* blue marker: accent */
  --red:#c8322b;           /* red marker: answers, warnings */
  --green:#1d8a4e;         /* green marker: correct */
  --tray:#eef1f4;          /* marker tray */
  --tile:#ffffff;
  --gold:#b7791f;
  --f-marker:ui-rounded,"Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--board);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;
}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:18px 24px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--f-marker);font-weight:700;font-size:clamp(30px,4.2vw,50px);line-height:1;margin:0;color:var(--blue);text-wrap:balance}
h1 span{color:var(--red)}
.sub{font-size:15px;color:var(--ink-soft);margin:0}
.eqs{font-family:var(--f-data);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink)}
.eqs b{color:var(--blue)}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--tile);color:var(--ink);padding:6px 14px}
button:hover{background:#f3f6fa}
button:focus-visible,.tile:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#184c99}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);text-decoration:underline;padding:4px 6px}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cat{font-family:var(--f-marker);font-weight:700;text-align:center;padding:10px 8px 6px;border-bottom:4px solid currentColor;line-height:1.1}
.cat .code{display:block;font-family:var(--f-data);font-size:14px;font-weight:700;letter-spacing:.06em;opacity:.85}
.cat .name{font-size:clamp(17px,1.9vw,24px)}
.c0{color:var(--blue)}.c1{color:var(--red)}.c2{color:var(--green)}.c3{color:var(--ink)}
.tile{background:var(--tile);border:2px solid var(--ink);border-radius:10px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:3px 3px 0 rgba(29,35,43,.12);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .val{font-family:var(--f-marker);font-weight:700;font-size:clamp(30px,3.4vw,44px);line-height:1}
.tile .lvl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.tile.used{background:transparent;border-style:dashed;border-color:#b9c2cc;box-shadow:none;color:#9aa4ae}
.tile.used .val{text-decoration:line-through;text-decoration-thickness:3px}
.final{grid-column:1/-1;min-height:70px;flex-direction:row;gap:16px;border-color:var(--gold);border-width:3px}
.final .val{font-size:clamp(24px,3vw,36px);color:var(--gold)}
.boardbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

details.howto{background:var(--tile);border:2px solid var(--ink);border-radius:10px;padding:10px 16px}
details.howto summary{font-family:var(--f-marker);font-weight:700;font-size:20px;cursor:pointer;color:var(--blue)}
.howgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 32px;font-size:16px}
.howgrid h3{font-family:var(--f-marker);font-size:19px;margin:10px 0 4px;color:var(--ink)}
.howgrid ol,.howgrid ul{margin:0;padding-left:22px}
.howgrid li{margin:3px 0}
table.ros{border-collapse:collapse;width:100%;font-size:15px}
table.ros td{border-top:1px solid var(--grid);padding:5px 6px;vertical-align:top}
table.ros td:first-child{font-family:var(--f-data);white-space:nowrap;color:var(--blue);font-weight:700}

/* ---------- question view ---------- */
.qview{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.qtag{font-family:var(--f-marker);font-weight:700;font-size:26px}
.qtag small{font-family:var(--f-body);font-size:15px;font-weight:400;color:var(--ink-soft);margin-left:8px}
.dd{font-family:var(--f-marker);font-weight:700;color:#fff;background:var(--gold);padding:2px 12px;border-radius:6px;font-size:20px}
.timer{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--f-data);font-weight:700;font-size:34px;min-width:4.2ch;text-align:right;font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.qbody.nofig{grid-template-columns:minmax(0,1fr)}
.prompt{font-size:clamp(20px,2.1vw,27px);line-height:1.4}
.prompt p{margin:0 0 10px}
.prompt ol{margin:6px 0 0;padding-left:1.4em}
.prompt li{margin:6px 0}
.mono{font-family:var(--f-data);font-size:.92em;white-space:nowrap}
.fig{background:var(--tile);border:2px solid var(--ink);border-radius:10px;padding:8px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:320px}
table.data{border-collapse:collapse;font-family:var(--f-data);font-size:24px;margin:6px auto}
table.data th,table.data td{border:2px solid var(--ink);padding:6px 18px;text-align:center}
table.data th{background:var(--tray);font-family:var(--f-body)}
.answer{border:3px solid var(--red);border-radius:12px;background:#fff;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.answer.nofig{grid-template-columns:minmax(0,1fr)}
.answer h2{font-family:var(--f-marker);color:var(--red);margin:0 0 6px;font-size:26px}
.answer ol{margin:0;padding-left:1.4em;font-size:clamp(18px,1.8vw,23px)}
.answer li{margin:5px 0}
.watch{margin-top:10px;font-size:16px;color:var(--ink-soft);border-top:1px dashed #b9c2cc;padding-top:8px}
.watch b{color:var(--ink)}
.award{background:var(--tray);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.award .hint{font-size:15px;color:var(--ink-soft);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:6px 14px;font-weight:700;border:2px solid var(--ink-soft);background:#fff;color:var(--ink)}
.chip[data-s="full"]{background:var(--green);border-color:var(--green);color:#fff}
.chip[data-s="half"]{background:#fff;border-color:var(--green);color:var(--green);border-style:dashed}
.chip[data-s="lose"]{background:var(--red);border-color:var(--red);color:#fff}
.wagers{display:flex;flex-wrap:wrap;gap:10px}
.wagers label{display:flex;align-items:center;gap:6px;font-weight:700;background:#fff;border:2px solid var(--ink-soft);border-radius:10px;padding:4px 10px}
.wagers input{width:5.5ch;font:inherit;font-family:var(--f-data);border:1px solid var(--ink-soft);border-radius:6px;padding:2px 4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* ---------- scoreboard ---------- */
.tray{margin-top:auto;background:var(--tray);border-top:4px solid #cfd6de;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column-reverse;gap:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.team{min-width:0;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.team.lead{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.team input{font:inherit;font-weight:700;font-size:16px;border:none;background:transparent;width:100%;min-width:0;color:var(--ink);padding:0}
.team .pts{font-family:var(--f-data);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.team .adj{display:flex;gap:4px}
.team .adj button{flex:1 1 0;min-width:0;padding:0 2px;font-size:13px;border-width:1px;border-radius:6px}
.traytools{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 16px;font-size:14px}
.traytools label{display:flex;gap:6px;align-items:center}
.traytools select{font:inherit}
.confirm{display:flex;gap:8px;align-items:center;font-size:14px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.resetbtn{border-color:var(--red);color:var(--red);font-weight:700;font-size:15px}
.resetbtn:hover{background:#fbeeed}
.confirm.reset{flex-wrap:wrap;justify-content:flex-end;background:#fbeeed;border:2px solid var(--red);border-radius:8px;padding:6px 10px;font-size:15px;font-weight:700}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:820px){.hright{align-items:flex-start}}

@media (max-width:820px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qbody,.answer,.howgrid{grid-template-columns:minmax(0,1fr)}
  .cat{display:none}
  .tile .cattag{display:block}
}
.tile .cattag{display:none;font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}</style>

<div class="wrap" id="app"></div>

<script>
/* ================= QUESTION BANK =================
   All numbers checked in a script before publishing. */
const CATS=[
 {code:"2-1",name:"Words & Motion Maps"},
 {code:"2-2",name:"Position–Time Graphs"},
 {code:"2-3",name:"Velocity–Time Graphs"},
 {code:"2-4",name:"Equations & Two Objects"}
];
const LEVEL={100:"Beginner",200:"Beginner",300:"Intermediate",400:"Advanced"};
const TIME={100:120,200:180,300:240,400:300,final:360};

const Q={
"2-1|100":{
  prompt:`<p>A ball is recorded once every second, starting at t<sub>0</sub>.</p><ol><li>What is its starting position?</li><li>Which direction is it moving? How can you tell?</li><li>What is its speed?</li></ol>`,
  fig:{type:"mm",x:[0,12,2],rows:[{dots:[2,4,6,8,10],arrows:[2,2,2,2,2],t:true}]},
  ans:["x<sub>i</sub> = 2 m (positive side of the origin)","Positive direction: arrows point right and each dot is farther from the origin","2 m/s (equal 2 m spacing every second)"],
  watch:"Students reading the last dot (10 m) as the starting position."
},
"2-1|200":{
  prompt:`<p>Dots are 1 second apart.</p><p><b>Is this object moving at constant velocity?</b> Explain using evidence from the motion map.</p>`,
  fig:{type:"mm",x:[0,12,2],rows:[{dots:[0,4,7,9,10],arrows:[4,3,2,1,0.5],t:true}]},
  ans:["No. The spacing shrinks (4 m, 3 m, 2 m, 1 m each second) and the arrows get shorter, so it is slowing down.","Constant velocity needs equal spacing and equal-length arrows."],
  watch:"“Yes, because it keeps going the same direction.” Same direction is not the same as same velocity."
},
"2-1|300":{
  prompt:`<p>A cart starts at <span class="mono">+6 m</span> and rolls <b>toward the origin</b> at a constant 3 m/s for 4 s.</p><p>Draw the motion map: one dot per second, starting at t = 0, with a velocity arrow on each dot.</p>`,
  fig:null,
  ans:["Five dots at +6, +3, 0, −3, −6 m, all arrows pointing left and equal length","The cart passes the origin at t = 2 s and keeps going; it does not stop there"],
  ansFig:{type:"mm",x:[-8,8,2],rows:[{dots:[6,3,0,-3,-6],arrows:[-3,-3,-3,-3,-3],t:true}]},
  watch:"Boards that stop at the origin. “Toward the origin” sets the direction, not the destination."
},
"2-1|400":{
  prompt:`<ol><li>Write a complete description of the motion (not the graph shape): starting position, then direction and speed for segments A, B and C.</li><li>Draw a matching motion map, one row per segment.</li></ol>`,
  fig:{type:"plot",kind:"x",t:[0,10,1],y:[-6,6,2],series:[{pts:[[0,-4],[2,4],[5,4],[9,-4]],c:"blue"}],labels:[[0.7,1.6,"A"],[3.5,5.2,"B"],[7.3,1.6,"C"]]},
  ans:["Starts 4 m on the negative side of the origin","A (0–2 s): positive direction at 4 m/s, passing the origin at 1 s, to +4 m","B (2–5 s): at rest at +4 m for 3 s","C (5–9 s): negative direction at 2 m/s, passing the origin at 7 s, back to −4 m"],
  ansFig:{type:"mm",x:[-6,6,2],rows:[{label:"A",dots:[-4,0,4],arrows:[4,4,4]},{label:"B",dots:[4],arrows:[0],note:"v = 0 (2–5 s)"},{label:"C",dots:[4,2,0,-2,-4],arrows:[-2,-2,-2,-2,-2]}]},
  watch:"Descriptions like “it goes up, then flat, then down.” That is the graph, not the motion."
},
"2-2|100":{
  prompt:`<ol><li>Which object is moving faster, A or B? How can you tell?</li><li>Find the velocity of each.</li></ol>`,
  fig:{type:"plot",kind:"x",t:[0,5,1],y:[0,20,5],series:[{pts:[[0,0],[5,20]],c:"blue",name:"A"},{pts:[[0,5],[5,15]],c:"red",name:"B"}]},
  ans:["A: its line is steeper (larger slope)","v<sub>A</sub> = 20 m ÷ 5 s = 4 m/s; v<sub>B</sub> = 10 m ÷ 5 s = 2 m/s"],
  watch:"Picking B because it starts ahead. A head start is the intercept, not the speed."
},
"2-2|200":{
  prompt:`<ol><li>What is the object's velocity?</li><li>Where is it at t = 3 s?</li><li>When does it reach the origin?</li></ol>`,
  fig:{type:"plot",kind:"x",t:[0,8,1],y:[0,14,2],series:[{pts:[[0,12],[6,0]],c:"blue"}]},
  ans:["v = (0 − 12 m) ÷ 6 s = −2 m/s","x = 6 m","t = 6 s"],
  watch:"Dropping the negative sign. A downhill x–t line means negative velocity, not slowing down."
},
"2-2|300":{
  prompt:`<p>For the whole trip from t = 0 to t = 10 s, find:</p><ol><li>the average velocity</li><li>the average speed</li></ol>`,
  fig:{type:"plot",kind:"x",t:[0,10,1],y:[0,10,2],series:[{pts:[[0,0],[4,8],[8,8],[10,0]],c:"blue"}]},
  ans:["Displacement = 0 − 0 = 0 m, so average velocity = 0 m/s","Distance = 8 m + 8 m = 16 m, so average speed = 16 m ÷ 10 s = 1.6 m/s"],
  watch:"Treating average speed and average velocity as the same number. Ask: “Where did it end up?” vs. “How far did it travel?”"
},
"2-2|400":{
  prompt:`<p>Draw a <b>quantitative</b> velocity vs. time graph for this motion. Label the value of each segment.</p>`,
  fig:{type:"plot",kind:"x",t:[0,10,1],y:[-8,8,2],series:[{pts:[[0,-6],[4,6],[6,6],[10,-2]],c:"blue"}]},
  ans:["0–4 s: slope = 12 m ÷ 4 s = +3 m/s","4–6 s: 0 m/s (at rest)","6–10 s: slope = −8 m ÷ 4 s = −2 m/s","Each is a flat horizontal segment"],
  ansFig:{type:"plot",kind:"v",t:[0,10,1],y:[-4,4,1],segs:[[0,4,3],[4,6,0],[6,10,-2]],c:"red"},
  watch:"Copying the shape of the x–t graph, or joining the steps with slanted lines."
},
"2-3|100":{
  prompt:`<p>Describe the object's motion in a complete sentence.</p><p>Can you tell where the object started? Why or why not?</p>`,
  fig:{type:"plot",kind:"v",t:[0,6,1],y:[-4,4,1],segs:[[0,6,-3]],c:"blue"},
  ans:["It moves in the negative direction at a constant speed of 3 m/s for 6 s","No. A v–t graph shows velocity, not position"],
  watch:"“It's below zero, so it's behind the origin” or “it's going down.” Below the axis means negative direction."
},
"2-3|200":{
  prompt:`<ol><li>What is the displacement from 0 to 5 s?</li><li>The object started at <span class="mono">x = −8 m</span>. Where is it at t = 5 s?</li></ol>`,
  fig:{type:"plot",kind:"v",t:[0,6,1],y:[0,6,1],segs:[[0,5,4]],c:"blue"},
  ans:["Δx = area = (4 m/s)(5 s) = 20 m","x<sub>f</sub> = −8 m + 20 m = 12 m"],
  watch:"Answering 20 m for the final position (forgetting x<sub>i</sub>)."
},
"2-3|300":{
  prompt:`<ol><li>Find Δx for 0–4 s, 4–6 s and 6–10 s.</li><li>Find the total displacement.</li><li>Find the total distance traveled.</li></ol>`,
  fig:{type:"plot",kind:"v",t:[0,10,1],y:[-4,4,1],segs:[[0,4,3],[4,6,0],[6,10,-2]],c:"blue"},
  ans:["+12 m, 0 m, −8 m","Total displacement = +4 m","Total distance = 12 + 0 + 8 = 20 m"],
  watch:"Adding the −8 m area as positive for displacement, or subtracting it for distance."
},
"2-3|400":{
  prompt:`<p>The object starts at the origin.</p><ol><li>How far from the origin does it get, and when?</li><li>When is it back at the origin?</li><li>Sketch the matching position vs. time graph.</li></ol>`,
  fig:{type:"plot",kind:"v",t:[0,12,1],y:[-4,6,1],segs:[[0,4,5],[4,12,-2.5]],c:"blue"},
  ans:["20 m, at t = 4 s (area = 5 × 4)","It needs another 20 m at 2.5 m/s, which takes 8 s, so t = 12 s","x–t: straight line up to (4 s, 20 m), then straight line down to (12 s, 0 m)"],
  ansFig:{type:"plot",kind:"x",t:[0,12,1],y:[0,24,4],series:[{pts:[[0,0],[4,20],[12,0]],c:"red"}]},
  watch:"Saying it turns back when the v–t line crosses zero “at 4 s, so back at 8 s.” The return trip is slower."
},
"2-4|100":{
  prompt:`<p>An object's motion is given by</p><p class="mono" style="font-size:1.25em">x = −3t + 15</p><ol><li>Starting position?</li><li>Velocity and direction?</li><li>Position at t = 2 s?</li></ol>`,
  fig:null,
  ans:["x<sub>i</sub> = 15 m","v = −3 m/s, the negative direction (toward the origin)","x = −3(2) + 15 = 9 m"],
  watch:"Swapping slope and intercept (“starts at −3”)."
},
"2-4|200":{
  prompt:`<p>Write the equation of motion for this object.</p><table class="data"><tr><th>t (s)</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>x (m)</th><td>−2</td><td>1.5</td><td>5</td><td>8.5</td><td>12</td></tr></table>`,
  fig:null,
  ans:["v = (12 − (−2)) m ÷ 4 s = 3.5 m/s","x<sub>i</sub> = −2 m (the position at t = 0)","x = 3.5t − 2"],
  watch:"Using the t = 1 s value (1.5 m) as the intercept."
},
"2-4|300":{
  prompt:`<p>A runner starts 40 m from the origin and runs <b>toward the origin</b> at a constant 5 m/s.</p><ol><li>Write the runner's equation of motion.</li><li>Where is the runner at t = 3 s?</li><li>When does the runner reach the origin?</li></ol>`,
  fig:null,
  ans:["x = −5t + 40","x = −5(3) + 40 = 25 m","0 = −5t + 40, so t = 8 s"],
  watch:"Writing +5 m/s. Toward the origin from the positive side is the negative direction."
},
"2-4|400":{
  prompt:`<p>Walker A starts at the origin moving at +4 m/s. Walker B starts at 60 m moving at −2 m/s. Both start at t = 0.</p><ol><li>Write an equation for each.</li><li>When do they meet?</li><li>Where do they meet?</li></ol>`,
  fig:null,
  ans:["x<sub>A</sub> = 4t;  x<sub>B</sub> = −2t + 60","Set equal: 4t = −2t + 60, so 6t = 60 and t = 10 s","x = 4(10) = 40 m (check: −2(10) + 60 = 40 m)"],
  ansFig:{type:"plot",kind:"x",t:[0,12,1],y:[0,70,10],series:[{pts:[[0,0],[12,48]],c:"blue",name:"A"},{pts:[[0,60],[12,36]],c:"red",name:"B"}],dot:[10,40]},
  watch:"Stopping at the time and never finding the position, or adding the speeds and then dividing the wrong distance."
},
"final":{
  prompt:`<p>Two cars are <b>120 m apart</b> and drive straight toward each other. Car A starts at the origin at 8 m/s. Car B starts at x = 120 m at 12 m/s.</p><ol><li>Write an equation of motion for each car.</li><li>Sketch both on one position vs. time graph.</li><li>When do they collide?</li><li>Where do they collide?</li></ol>`,
  fig:null,
  ans:["x<sub>A</sub> = 8t;  x<sub>B</sub> = −12t + 120","8t = −12t + 120, so 20t = 120 and t = 6 s","x = 8(6) = 48 m (check: −12(6) + 120 = 48 m)","Graph: A rises from (0, 0); B falls from (0, 120); they cross at (6 s, 48 m)"],
  ansFig:{type:"plot",kind:"x",t:[0,10,1],y:[0,120,20],series:[{pts:[[0,0],[10,80]],c:"blue",name:"A"},{pts:[[0,120],[10,0]],c:"red",name:"B"}],dot:[6,48]},
  watch:"Car B's velocity written as +12 m/s. This is the same problem type as the test's two-object question."
}
};

/* ================= FIGURES (SVG) ================= */
const COL={blue:"#1f5fbf",red:"#c8322b",green:"#1d8a4e",ink:"#1d232b"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(n){return (n<0?"−":"")+Math.abs(n)}
function plot(f){
  const W=560,H=340,L=64,R=24,T=18,B=52;
  const [t0,t1,ts]=f.t,[y0,y1,ys]=f.y;
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R), Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${f.kind==="x"?"position":"velocity"} versus time graph" font-family="system-ui, sans-serif">`;
  for(let t=t0;t<=t1+1e-9;t+=ts){s+=`<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${H-B}" stroke="#dfe5eb" stroke-width="1"/>`;
    s+=`<text x="${X(t)}" y="${Math.max(Y(Math.max(y0,Math.min(0,y1))),T)+20}" text-anchor="middle" font-size="14" fill="${COL.ink}">${t}</text>`;}
  for(let y=y0;y<=y1+1e-9;y+=ys){s+=`<line x1="${L}" y1="${Y(y)}" x2="${W-R}" y2="${Y(y)}" stroke="#dfe5eb" stroke-width="1"/>`;
    s+=`<text x="${L-8}" y="${Y(y)+5}" text-anchor="end" font-size="14" fill="${COL.ink}">${fmt(+y.toFixed(2))}</text>`;}
  const y0line=Y(Math.max(y0,Math.min(0,y1)));
  s+=`<line x1="${L}" y1="${y0line}" x2="${W-R}" y2="${y0line}" stroke="${COL.ink}" stroke-width="2"/>`;
  s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="${COL.ink}" stroke-width="2"/>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle" font-size="15" font-weight="700" fill="${COL.ink}">time (s)</text>`;
  s+=`<text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="${COL.ink}">${f.kind==="x"?"position (m)":"velocity (m/s)"}</text>`;
  (f.series||[]).forEach(se=>{const c=COL[se.c]||COL.blue;
    s+=`<polyline points="${se.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(se.name){const p=se.pts[se.pts.length-1],ty=Y(p[1])-10<T+18?Y(p[1])+24:Y(p[1])-10;s+=`<text x="${X(p[0])-8}" y="${ty}" text-anchor="end" font-size="20" font-weight="700" fill="${c}">${se.name}</text>`;}
  });
  (f.segs||[]).forEach(g=>{const c=COL[f.c]||COL.blue;
    s+=`<line x1="${X(g[0])}" y1="${Y(g[2])}" x2="${X(g[1])}" y2="${Y(g[2])}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;});
  (f.labels||[]).forEach(l=>{s+=`<text x="${X(l[0])}" y="${Y(l[1])}" text-anchor="middle" font-size="20" font-weight="700" fill="${COL.red}">${l[2]}</text>`;});
  if(f.dot){s+=`<circle cx="${X(f.dot[0])}" cy="${Y(f.dot[1])}" r="7" fill="${COL.green}"/><text x="${X(f.dot[0])+10}" y="${Y(f.dot[1])+24}" font-size="15" font-weight="700" fill="${COL.green}">(${f.dot[0]} s, ${f.dot[1]} m)</text>`;}
  return s+"</svg>";
}
function mm(f){
  const [x0,x1,xs]=f.x,W=560,L=(f.rows.some(r=>r.label)?44:24),R=24,rowH=f.rows.some(r=>r.t)?78:62,top=10,H=top+rowH*f.rows.length+76;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), k=(W-L-R)/(x1-x0)*0.45;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="motion map" font-family="system-ui, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COL.blue}"/></marker></defs>`;
  f.rows.forEach((r,i)=>{const yd=top+rowH*i+rowH-(r.t?30:14), ya=yd-18;
    if(r.label)s+=`<text x="8" y="${yd+6}" font-size="20" font-weight="700" fill="${COL.red}">${r.label}</text>`;
    r.dots.forEach((d,j)=>{s+=`<circle cx="${X(d)}" cy="${ya}" r="7" fill="${COL.ink}"/>`;
      const a=r.arrows[j]; if(a){s+=`<line x1="${X(d)}" y1="${ya}" x2="${X(d)+a*k}" y2="${ya}" stroke="${COL.blue}" stroke-width="3.5" marker-end="url(#ah)"/>`;}
      if(r.t)s+=`<text x="${X(d)}" y="${ya+26}" text-anchor="middle" font-size="14" fill="${COL.ink}">t${j}</text>`;});
    if(r.note){const nx=X(r.dots[0]),right=nx>W/2;s+=`<text x="${right?nx-16:nx+16}" y="${ya+5}" text-anchor="${right?"end":"start"}" font-size="15" fill="${COL.ink}">${r.note}</text>`;}
  });
  const yl=H-58;
  s+=`<line x1="${L-6}" y1="${yl}" x2="${W-R+4}" y2="${yl}" stroke="${COL.ink}" stroke-width="2"/>`;
  for(let x=x0;x<=x1;x+=xs){s+=`<line x1="${X(x)}" y1="${yl-6}" x2="${X(x)}" y2="${yl+6}" stroke="${COL.ink}" stroke-width="2"/><text x="${X(x)}" y="${yl+24}" text-anchor="middle" font-size="14" font-weight="${x===0?700:400}" fill="${COL.ink}">${fmt(x)}</text>`;}
  s+=`<text x="${W-R}" y="${yl+46}" text-anchor="end" font-size="14" font-weight="700" fill="${COL.ink}">position (m) →</text>`;
  return s+"</svg>";
}
function fig(f){return f? (f.type==="mm"?mm(f):plot(f)) : ""}

/* ================= STATE ================= */
const KEY="cv-showdown-v1";
function freshState(n){
  return {teams:Array.from({length:n||9},(_,i)=>({name:"Team "+(i+1),score:0})),used:{},dd:null,view:"board",cur:null,marks:{},wagers:{},revealed:false};
}
let S;
function load(d){ if(d&&d.teams){S=d;return}
  try{const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw);return}}catch(e){}
  S=freshState(9);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= TIMER ================= */
let tLeft=0,tRun=false,tInt=null;
function setTimer(sec){tLeft=sec;tRun=false;clearInterval(tInt);drawClock()}
function toggleTimer(){tRun=!tRun;clearInterval(tInt);if(tRun){tInt=setInterval(()=>{tLeft=Math.max(0,tLeft-1);if(!tLeft){tRun=false;clearInterval(tInt)}drawClock()},1000)}drawClock()}
function drawClock(){const c=document.getElementById("clock"),b=document.getElementById("tbtn");if(!c)return;
  c.textContent=Math.floor(tLeft/60)+":"+String(tLeft%60).padStart(2,"0");c.classList.toggle("low",tLeft<=30);if(b)b.textContent=tRun?"Pause":(tLeft?"Start":"Done")}

/* ================= RENDER ================= */
const app=document.getElementById("app");
function header(){return `<header class="top"><div><h1>Constant Velocity <span>Showdown</span></h1><p class="sub">General Physics · Unit 2 review · Standards 2-1 to 2-4</p></div>
<div class="hright"><div class="eqs"><span><b>v</b> = Δx / Δt</span><span><b>x</b> = vt + x<sub>i</sub></span><span><b>Δx</b> = x<sub>f</sub> − x<sub>i</sub></span><span>avg <b>speed</b> = distance / Δt</span></div>
${S.confirmReset?`<span class="confirm reset" role="alert">Clear all scores, team names and used tiles? <button class="danger" data-act="resetyes">Yes, reset everything</button><button data-act="resetno">Cancel</button></span>`:`<button class="resetbtn" data-act="reset">↺ Reset everything</button>`}</div></header>`}
/* Score-adjust buttons use the open question's value;
   on the Final they use that team's wager; on the board they default to 100. */
function adjStep(i){
  if(S.view==="q"&&S.cur){
    if(S.cur==="final"){const w=+(S.wagers[i]||0);return w>0?w:100}
    const p=+S.cur.split("|")[1];return p;
  }
  return 100;
}
function adjBtns(i){const v=adjStep(i);return `<button data-adj="${i}" data-v="${-v}" aria-label="Subtract ${v}">−${v}</button><button data-adj="${i}" data-v="${v}" aria-label="Add ${v}">+${v}</button>`}
function tray(){
  const max=Math.max(...S.teams.map(t=>t.score));
  return `<section class="tray" aria-label="Scoreboard"><div class="teams">${S.teams.map((t,i)=>`<div class="team ${max>0&&t.score===max?"lead":""}"><input id="tn${i}" value="${esc(t.name)}" aria-label="Team name" data-tn="${i}"><div class="pts">${t.score}</div><div class="adj">${adjBtns(i)}</div></div>`).join("")}</div>
  <div class="traytools"><label>Teams <select id="nteams">${[2,3,4,5,6,7,8,9,10].map(n=>`<option ${n===S.teams.length?"selected":""}>${n}</option>`).join("")}</select></label>
  </div></section>`;
}
function howto(){return `<details class="howto" ${S.howOpen?"open":""} id="how"><summary>How to run it (108-minute block)</summary><div class="howgrid">
<div><h3>Rules</h3><ol>
<li>Teams of 3 at the vertical whiteboards, one marker per team. The marker rotates every question.</li>
<li>Teams take turns choosing a tile. <b>Every team answers every question.</b></li>
<li>When time is up, markers down. Reveal the answer and tap each team's chip: <b>full</b> points, or <b>half</b> on 300s and 400s for mostly-right work with one slip. The ± buttons under each team's score always match the open question's value, for quick corrections.</li>
<li><b>Final Showdown:</b> teams write a wager (up to their score, max 500) in the corner of the board before the question appears. Right: gain it. Wrong: lose it.</li>
</ol>
<h3>Why this format</h3><ul><li>Each column is one test standard, and the rows climb Beginner → Advanced, matching the SBG levels on Friday's test.</li><li>The “Watch for” line under each answer is the misconception to name out loud before moving on.</li></ul></div>
<div><h3>Run of show</h3><table class="ros">
<tr><td>0–8</td><td>Form teams, pass out markers, quick rules</td></tr>
<tr><td>8–35</td><td>Round 1: all 100s and 200s (8 tiles, ~3 min each)</td></tr>
<tr><td>35–40</td><td>Brain break / reshuffle one member per team</td></tr>
<tr><td>40–78</td><td>Round 2: 300s and 400s (8 tiles, ~4–5 min each)</td></tr>
<tr><td>78–90</td><td>Final Showdown: two cars collide</td></tr>
<tr><td>90–108</td><td>Solo self-check: SCAFFOLD-2 Representation Self-Check, or Standards Sample Questions for the standard each student feels weakest on</td></tr>
</table></div></div></details>`}
function boardView(){
  let g=CATS.map((c,i)=>`<div class="cat c${i}"><span class="code">${c.code}</span><span class="name">${c.name}</span></div>`).join("");
  for(const p of [100,200,300,400]) CATS.forEach((c,i)=>{const k=c.code+"|"+p,u=S.used[k];
    g+=`<div class="tile ${u?"used":""} c${i}" role="button" tabindex="0" data-open="${k}" aria-label="${c.code} ${p} ${u?"(done)":""}"><span class="cattag">${c.code}</span><span class="val">${p}</span><span class="lvl">${LEVEL[p]}</span></div>`;});
  g+=`<div class="tile final ${S.used.final?"used":""}" role="button" tabindex="0" data-open="final"><span class="val">Final Showdown</span><span class="lvl">Two cars · wager</span></div>`;
  return header()+`<section class="board" aria-label="Game board">${g}</section>`+howto()+tray();
}
function qView(){
  const k=S.cur,q=Q[k],isFinal=k==="final",[code,pStr]=isFinal?["Final",""]:k.split("|"),p=+pStr,dd=false;
  const cat=CATS.find(c=>c.code===code),ci=CATS.indexOf(cat);
  const val=isFinal?0:p*(dd?2:1);
  const tag=isFinal?`<span class="qtag" style="color:var(--gold)">Final Showdown<small>wager up to 500</small></span>`:
    `<span class="qtag c${ci}">${code} · ${cat.name} · ${p}<small>${LEVEL[p]}</small></span>${dd?`<span class="dd">Daily Double: ${val} pts</span>`:""}`;
  let h=header()+`<section class="qview"><div class="qhead"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${tag}</div>
  <div class="timer"><span class="clock" id="clock" aria-live="off"></span><button id="tbtn" data-act="timer">Start</button><button data-act="plus30">+30 s</button></div></div>
  <div class="qbody ${q.fig?"":"nofig"}"><div class="prompt">${q.prompt}</div>${q.fig?`<div class="fig">${fig(q.fig)}</div>`:""}</div>`;
  if(isFinal && !S.revealed){
    h+=`<div class="award"><p class="hint">Enter each team's wager before revealing (max = their score, up to 500).</p><div class="wagers">${S.teams.map((t,i)=>`<label>${esc(t.name)} <input id="wg${i}" type="number" min="0" step="50" value="${S.wagers[i]||0}" data-wg="${i}"></label>`).join("")}</div></div>`;
  }
  if(!S.revealed){
    h+=`<div class="actions"><button class="ghost" data-act="back">Back to board without scoring</button><button class="primary" data-act="reveal">Reveal answer</button></div>`;
  } else {
    h+=`<div class="answer ${q.ansFig?"":"nofig"}"><div><h2>Answer</h2><ol>${q.ans.map(a=>`<li>${a}</li>`).join("")}</ol><div class="watch"><b>Watch for:</b> ${q.watch}</div></div>${q.ansFig?`<div class="fig">${fig(q.ansFig)}</div>`:""}</div>`;
    const half=isFinal?false:p>=300;
    h+=`<div class="award"><p class="hint">${isFinal?"Tap once for correct (gain wager), twice for wrong (lose wager).":`Tap a team: once = full (${val})${half?`, twice = half (${val/2})`:""}, again = clear.`}</p>
    <div class="chips">${S.teams.map((t,i)=>{const m=S.marks[i]||"";const lab=m==="full"?(isFinal?"+"+(S.wagers[i]||0):"+"+val):m==="half"?"+"+val/2:m==="lose"?"−"+(S.wagers[i]||0):"";
      return `<button class="chip" data-s="${m}" data-mark="${i}">${esc(t.name)} ${lab}</button>`}).join("")}</div>
    <div class="actions"><button class="ghost" data-act="hide">Hide answer</button><button class="primary" data-act="commit">Add points &amp; back to board</button></div></div>`;
  }
  return h+`</section>`+tray();
}
function render(){app.innerHTML=S.view==="q"?qView():boardView();if(S.view==="q")drawClock();save()}

/* ================= EVENTS ================= */
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-act],[data-adj],[data-mark]");if(!t)return;
  if(t.dataset.open){const k=t.dataset.open;S.cur=k;S.view="q";S.marks={};S.revealed=false;if(k==="final")S.wagers={};
    const p=k==="final"?"final":+k.split("|")[1];setTimer(TIME[p]);render();window.scrollTo(0,0);return}
  if(t.dataset.adj!=null){S.teams[+t.dataset.adj].score+=+t.dataset.v;render();return}
  if(t.dataset.mark!=null){const i=+t.dataset.mark,k=S.cur,isF=k==="final",p=isF?0:+k.split("|")[1];
    const order=isF?["","full","lose"]:(p>=300?["","full","half"]:["","full"]);
    const cur=S.marks[i]||"";S.marks[i]=order[(order.indexOf(cur)+1)%order.length];render();return}
  const a=t.dataset.act;
  if(a==="timer"){if(!tLeft)return;toggleTimer()}
  else if(a==="plus30"){tLeft+=30;drawClock()}
  else if(a==="reveal"){S.revealed=true;tRun=false;clearInterval(tInt);render()}
  else if(a==="hide"){S.revealed=false;render()}
  else if(a==="back"){S.view="board";S.cur=null;clearInterval(tInt);render()}
  else if(a==="commit"){const k=S.cur,isF=k==="final",p=isF?0:+k.split("|")[1],val=isF?0:p;
    S.teams.forEach((tm,i)=>{const m=S.marks[i];const w=+(S.wagers[i]||0);
      if(m==="full")tm.score+=isF?w:val; else if(m==="half")tm.score+=val/2; else if(m==="lose")tm.score-=w;});
    S.used[k]=true;S.view="board";S.cur=null;clearInterval(tInt);render()}
  else if(a==="reset"){S.confirmReset=true;render()}
  else if(a==="resetno"){S.confirmReset=false;render()}
  else if(a==="resetyes"){const n=S.teams.length;clearInterval(tInt);tRun=false;try{localStorage.removeItem(KEY)}catch(e){}S=freshState(n);render();window.scrollTo(0,0)}
});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open){e.preventDefault();e.target.click()}});
app.addEventListener("change",e=>{
  if(e.target.id==="nteams"){const n=+e.target.value;while(S.teams.length<n)S.teams.push({name:"Team "+(S.teams.length+1),score:0});S.teams.length=n;render()}
  if(e.target.dataset.tn!=null){S.teams[+e.target.dataset.tn].name=e.target.value||("Team "+(+e.target.dataset.tn+1));render()}
});
app.addEventListener("input",e=>{if(e.target.dataset.wg!=null){const i=+e.target.dataset.wg;S.wagers[i]=Math.max(0,+e.target.value||0);save();const box=document.querySelectorAll(".tray .adj")[i];if(box)box.innerHTML=adjBtns(i)}});
app.addEventListener("toggle",e=>{if(e.target.id==="how"){S.howOpen=e.target.open;save()}},true);

function start(d){load(d);S.dd=null;render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
