*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--night);

      <button class="btn ghost" id="resetYes" style="padding:4px 10px">Yes, reset</button>

  </div>

<script>
/* =====================================================================
   ESCAPE ROOM ENGINE (reusable). To make a new unit, copy this file and
   replace the ROOM object below. Answers are stored only as salted
   hashes (cyrb53); generate them with the helper in the teacher guide.
   ===================================================================== */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* ---------- CLASS TIMER + FINISH CODES (shared with teacher.html; keep identical) ---------- */
const TALPH = 'ACDEFGHJKMNPQRTUVWXY34679';
const pad2 = n => String(n).padStart(2, '0');
function dayKey(d = new Date()) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function tmac(s, day) { const h = parseInt(cyrb53('mrc-class-timer::' + (day || dayKey()) + '::' + s), 36); return TALPH[h % 25] + TALPH[Math.floor(h / 25) % 25]; }
function timerCode(endMs) { const d = new Date(endMs), t = pad2(d.getHours()) + pad2(d.getMinutes()); return t + '-' + tmac('T' + t); }
function offCode() { return 'OFF-' + tmac('OFF'); }
function finishCode(ms, hints) { const d = new Date(ms), t = pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds()); return t + '-' + hints + '-' + tmac('F' + t + '-' + hints); }
function cleanCode(raw) { return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
// -> {type:'end', end:ms} | {type:'off'} | null
function parseTimerCode(raw) {
  const c = cleanCode(raw); let m;
  if ((m = c.match(/^OFF([A-Z0-9]{2})$/)) && m[1] === tmac('OFF')) return { type: 'off' };
  if ((m = c.match(/^(\d{4})([A-Z0-9]{2})$/)) && m[2] === tmac('T' + m[1])) {
    const hh = +m[1].slice(0, 2), mm = +m[1].slice(2); if (hh > 23 || mm > 59) return null;
    const d = new Date(); d.setHours(hh, mm, 0, 0); return { type: 'end', end: d.getTime() };
  }
  return null;
}
// -> {finish:ms, hints:n} | null
function parseFinishCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/\s/g, ''); const m = c.match(/^(\d{6})-?(\d{1,2})-?([A-Z0-9]{2})$/);
  if (!m || m[3] !== tmac('F' + m[1] + '-' + (+m[2]))) return null;
  const d = new Date(); d.setHours(+m[1].slice(0, 2), +m[1].slice(2, 4), +m[1].slice(4), 0);
  return { finish: d.getTime(), hints: +m[2] };
}

/* ---------- drawing helpers ---------- */
const sub = (main, s) => `${main}<tspan dy="4" font-size="10">${s}</tspan><tspan dy="-4"></tspan>`;
// Force diagram: dot on a dashed grid, arrows measured in grid units
function forceDiagram(forces, opts = {}) {
  const u = 16, size = opts.size || 176, c = size / 2;
  let g = '';
  for (let x = c % u; x <= size; x += u) g += `<line x1="${x}" y1="0" x2="${x}" y2="${size}" stroke="#b9c3cf" stroke-dasharray="3 3" stroke-width="1"/>`;
  for (let y = c % u; y <= size; y += u) g += `<line x1="0" y1="${y}" x2="${size}" y2="${y}" stroke="#b9c3cf" stroke-dasharray="3 3" stroke-width="1"/>`;
  let a = '';
  const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  forces.forEach(f => {
    const [dx, dy] = dirs[f.dir], L = f.len * u, x2 = c + dx * L, y2 = c + dy * L;
    a += `<line x1="${c}" y1="${c}" x2="${x2 - dx * 7}" y2="${y2 - dy * 7}" stroke="#14213d" stroke-width="3"/>`;
    const p = dx ? `${x2},${y2} ${x2 - dx * 10},${y2 - 6} ${x2 - dx * 10},${y2 + 6}` : `${x2},${y2} ${x2 - 6},${y2 - dy * 10} ${x2 + 6},${y2 - dy * 10}`;
    a += `<polygon points="${p}" fill="#14213d"/>`;
    // vertical arrows: label beside the tip; horizontal arrows: label above the tip, pulled inward
    const out = !!f.mag; // labels with magnitudes go outward past the tip (canvas is padded)
    const lx = dx ? x2 + (out ? dx * 8 : 0) : c + 8, ly = dy ? y2 + (dy > 0 ? 14 : -4) : (out ? c + 5 : c - 12);
    const anchor = out ? (dx < 0 ? 'end' : 'start') : (dx > 0 ? 'end' : 'start');
    a += `<text x="${lx}" y="${ly}" font-size="14" font-style="italic" fill="#0b6b6d" text-anchor="${anchor}">${sub('F', f.lab)}${f.mag ? ` = ${f.mag}` : ''}</text>`;
  });
  const px = opts.padX || 0;
  return `<svg viewBox="${-px} 0 ${size + 2 * px} ${size}" width="${size + 2 * px}" height="${size}" style="max-width:100%;height:auto" role="img" aria-label="force diagram"><rect width="${size}" height="${size}" fill="#fff"/>${g}${a}<circle cx="${c}" cy="${c}" r="5.5" fill="#d1495b"/></svg>`;
}
// Line graph on a grid. pts in data units.
function graph({ pts, xmax, ymax, xstep, ystep, xlab, ylab, w = 420, h = 250, ticks = true }) {
  const L = 48, B = 36, T = 12, R = 14, W = w - L - R, H = h - T - B;
  const X = x => L + x / xmax * W, Y = y => T + H - y / ymax * H;
  let s = `<rect width="${w}" height="${h}" fill="#fff"/>`;
  for (let x = 0; x <= xmax + 1e-9; x += xstep) s += `<line x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${T + H}" stroke="#dde3ea"/>` + (ticks ? `<text x="${X(x)}" y="${T + H + 16}" font-size="12" text-anchor="middle" fill="#3d4a66">${+x.toFixed(2)}</text>` : '');
  for (let y = 0; y <= ymax + 1e-9; y += ystep) s += `<line x1="${L}" y1="${Y(y)}" x2="${L + W}" y2="${Y(y)}" stroke="#dde3ea"/>` + (ticks ? `<text x="${L - 7}" y="${Y(y) + 4}" font-size="12" text-anchor="end" fill="#3d4a66">${+y.toFixed(2)}</text>` : '');
  s += `<line x1="${L}" y1="${T + H}" x2="${L + W}" y2="${T + H}" stroke="#14213d" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T + H}" stroke="#14213d" stroke-width="2"/>`;
  s += `<polyline points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="#d1495b" stroke-width="3.5" stroke-linejoin="round"/>`;
  s += `<text x="${L + W / 2}" y="${h - 3}" font-size="13" text-anchor="middle" fill="#14213d">${xlab}</text>`;
  s += `<text x="13" y="${T + H / 2}" font-size="13" text-anchor="middle" fill="#14213d" transform="rotate(-90 13 ${T + H / 2})">${ylab}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" role="img" aria-label="graph">${s}</svg>`;
}
function vectorBot(mood = 'smug') {
  const eyes = mood === 'mad' ? '<path d="M18 22 l8 3 M42 22 l-8 3" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round"/>' : '';
  const mouth = mood === 'happy' ? '<path d="M22 36 q8 7 16 0" stroke="#0d1b2a" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : mood === 'mad' ? '<path d="M22 39 q8 -6 16 0" stroke="#0d1b2a" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : '<path d="M23 37 h14" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round"/>';
  return `<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="32" r="25" fill="#7ee8e0"/><circle cx="30" cy="32" r="25" fill="none" stroke="#0f8b8d" stroke-width="3"/><rect x="14" y="20" width="32" height="12" rx="6" fill="#0d1b2a" opacity=".12"/><circle cx="22" cy="27" r="4" fill="#0d1b2a"/><circle cx="38" cy="27" r="4" fill="#0d1b2a"/>${eyes}${mouth}<line x1="30" y1="7" x2="30" y2="1" stroke="#0f8b8d" stroke-width="3"/><circle cx="30" cy="1.5" r="3" fill="#f4a259"/></svg>`;
}
const say = (html, mood) => `<div class="vector">${vectorBot(mood)}<div><div class="who">VECTOR</div><p>${html}</p></div></div>`;

// General line graph that allows negative y values, an optional shaded area, and a zero axis.
function graph2({ pts, xmin = 0, xmax, ymin = 0, ymax, xstep, ystep, xlab, ylab, w = 460, h = 280, shade = false, color = '#d1495b', marks = [] }) {
  const L = 52, B = 38, T = 12, R = 16, W = w - L - R, H = h - T - B;
  const X = x => L + (x - xmin) / (xmax - xmin) * W, Y = y => T + H - (y - ymin) / (ymax - ymin) * H;
  let s = `<rect width="${w}" height="${h}" fill="#fff"/>`;
  for (let x = xmin; x <= xmax + 1e-9; x += xstep) s += `<line x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${T + H}" stroke="#b9c3cf" stroke-dasharray="3 3"/><text x="${X(x)}" y="${T + H + 16}" font-size="12" text-anchor="middle" fill="#3d4a66">${+x.toFixed(3)}</text>`;
  for (let y = ymin; y <= ymax + 1e-9; y += ystep) s += `<line x1="${L}" y1="${Y(y)}" x2="${L + W}" y2="${Y(y)}" stroke="#b9c3cf" stroke-dasharray="3 3"/><text x="${L - 7}" y="${Y(y) + 4}" font-size="12" text-anchor="end" fill="#3d4a66">${+y.toFixed(3)}</text>`;
  const y0 = ymin < 0 ? Y(0) : T + H;
  if (shade) s += `<polygon points="${X(pts[0][0])},${y0} ${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')} ${X(pts[pts.length - 1][0])},${y0}" fill="#f4a259" opacity=".22"/>`;
  s += `<line x1="${L}" y1="${y0}" x2="${L + W}" y2="${y0}" stroke="#14213d" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T + H}" stroke="#14213d" stroke-width="2"/>`;
  s += `<polyline points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linejoin="round"/>`;
  marks.forEach(m => { s += `<circle cx="${X(m[0])}" cy="${Y(m[1])}" r="4.5" fill="#14213d"/>`; });
  s += `<text x="${L + W / 2}" y="${h - 3}" font-size="13" text-anchor="middle" fill="#14213d">${xlab}</text>`;
  s += `<text x="14" y="${T + H / 2}" font-size="13" text-anchor="middle" fill="#14213d" transform="rotate(-90 14 ${T + H / 2})">${ylab}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" role="img" aria-label="graph">${s}</svg>`;
}

// Ballistic pendulum sketch for Door 3 (numbers live on the role cards)

/* =====================================================================
   ENGINE
   ===================================================================== */
const KEY = 'escape:' + ROOM.id;
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } },
  set(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
};
let S = store.get() || { started: false, team: '', size: 4, start: 0, end: 0, door: 0, hints: {}, wrong: 0, role: 'A', timer: null };
const save = () => store.set(S);
const $ = (q, el = document) => el.querySelector(q);
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const hintsUsed = () => Object.values(S.hints).reduce((a, b) => a + b, 0);

function timerLive() { return S.timer && S.timer.end && S.timer.day === dayKey(); }
function timeUp() { return timerLive() && Date.now() >= S.timer.end && !S.end; }
function hud() {
  const t = S.started ? fmt((S.end || Date.now()) - S.start) : '00:00';
  let chip;
  if (timerLive() && !S.end) { const left = S.timer.end - Date.now();
    chip = `<button class="tchip ${left < 5 * 60000 ? 'low' : ''}" id="tchip" title="Class timer">⏳ Class <b>${left > 0 ? fmt(left) : '0:00'}</b></button>`; }
  else chip = `<button class="tchip" id="tchip" title="Enter class timer code">⏲ ${S.timer && S.timer.off && S.timer.day === dayKey() ? 'Timer off' : 'Timer code'}</button>`;
  $('#hud').innerHTML = `${chip}<span title="Your team's time">⏱ <b>${t}</b></span><span title="Hints used">💡 <b>${hintsUsed()}</b></span><span title="Wrong codes">✖ <b>${S.wrong}</b></span>`;
  $('#tchip').onclick = () => { $('#timerBox').classList.toggle('on'); $('#timerInput').focus(); };
}
let shownTimeUp = false;
setInterval(() => { hud(); const up = timeUp() && S.started; if (up !== shownTimeUp) render(); }, 1000);
function applyTimerCode(raw, msgEl) {
  const r = parseTimerCode(raw);
  if (!r) { if (msgEl) { msgEl.style.color = '#ffb3bd'; msgEl.textContent = "That timer code isn't valid. Check the board and try again."; } return false; }
  S.timer = r.type === 'off' ? { off: true, end: null, day: dayKey() } : { off: false, end: r.end, day: dayKey() };
  save();
  if (msgEl) { msgEl.style.color = '#9ff0b8'; msgEl.textContent = r.type === 'off' ? 'Timer turned off. Keep going!' : `Timer set: ends at ${new Date(r.end).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.`; }
  render(); return true;
}

function hall() {
  $('#hall').innerHTML = ROOM.doors.map((d, i) => {
    const cls = i < S.door ? 'open' : (i === S.door && S.started && !S.end ? 'current' : '');
    return `<div class="door-pill ${cls}"><span class="lock"></span><span class="n">${i + 1}</span>${d.name}</div>`;
  }).join('');
}

function normalize(v, f) {
  v = String(v).trim();
  if (f.kind === 'word') return v.toUpperCase().replace(/[^A-Z]/g, '');
  const m = v.replace(/,/g, '').match(/-?\d*\.?\d+/); // first number only, so units like "W/m2" are ignored
  if (!m) return '';
  const n = parseFloat(m[0]);
  const r = f.roundTo || 1;
  return String(Math.round(Math.abs(n) / r) * r);
}

function render() {
  hud(); hall();
  const st = $('#stage');
  if (!S.started) return renderIntro(st);
  if (S.door >= ROOM.doors.length) { shownTimeUp = false; return renderFinale(st); }
  shownTimeUp = timeUp();
  if (shownTimeUp) return renderTimeUp(st);
  const i = S.door, d = ROOM.doors[i];
  st.innerHTML = `<span class="tag">Door ${i + 1} of ${ROOM.doors.length} · ${d.tag}</span><h2>${d.name}</h2>${d.render()}
    <div class="lockbox">
      <div class="lbl">🔒 Door ${i + 1} lock</div>
      <form class="fields" id="lockForm" autocomplete="off">
        ${d.fields.map((f, k) => `<label class="field">${f.label}<input style="--w:${f.w}px" name="f${k}" inputmode="${f.kind === 'num' ? 'decimal' : 'text'}" required></label>`).join('')}
        <button class="btn" type="submit">Try code</button>
      </form>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="hints no-print">${d.hints.map((h, k) => `<button class="btn ghost" data-hint="${k}" ${k > (S.hints[i] || 0) ? 'disabled style="opacity:.4"' : ''}>💡 Hint ${k + 1}</button>`).join('')}</div>
      <div id="hintOut">${d.hints.slice(0, S.hints[i] || 0).map(h => `<div class="hinttext">${h}</div>`).join('')}</div>
    </div>`;
  if (d.roles) setupRoles(st, d);
  $('#lockForm').addEventListener('submit', e => { e.preventDefault(); check(d, i); });
  st.querySelectorAll('[data-hint]').forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.hint; if ((S.hints[i] || 0) <= k) { S.hints[i] = k + 1; save(); render(); }
  }));
  const first = st.querySelector('#lockForm input'); if (first && document.activeElement === document.body) first.focus({ preventScroll: true });
}

function setupRoles(st, d) {
  const box = $('[data-roles]', st), out = $('[data-rolecard]', st);
  const keys = Object.keys(d.roleCards);
  const draw = () => {
    box.innerHTML = '<span class="note" style="align-self:center;margin-right:4px">I am holding:</span>' + keys.map(k => `<button type="button" class="${k === S.role ? 'on' : ''}" data-r="${k}">Card ${k}</button>`).join('');
    out.innerHTML = d.roleCards[S.role] || '';
    box.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { S.role = b.dataset.r; save(); draw(); }));
  };
  draw();
}

function check(d, i) {
  const form = $('#lockForm'), fb = $('#fb');
  const vals = d.fields.map((f, k) => normalize(form.elements['f' + k].value, f));
  const h = cyrb53(ROOM.salt + 'd' + (i + 1) + '::' + vals.join('|'));
  if (d.answers.includes(h)) {
    S.door = i + 1;
    if (S.door >= ROOM.doors.length) { S.end = Date.now(); S.key = vals.join('|'); }
    save();
    fb.className = 'feedback good'; fb.textContent = '✔ ' + d.success;
    form.querySelector('button').disabled = true;
    setTimeout(render, 1400);
  } else {
    S.wrong++; save(); hud();
    fb.className = 'feedback bad';
    fb.textContent = '✖ ' + ROOM.wrongLines[Math.floor(Math.random() * ROOM.wrongLines.length)];
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  }
}

function renderIntro(st) {
  st.innerHTML = `<div class="center">
      <span class="tag">Escape Room · Teams of 3–4</span>
      <h2>${ROOM.title}</h2></div>
      ${say(ROOM.intro + ' <br><br>The clock starts when you press the button. Hints are free, but I <i>count</i> them. Mwahaha.')}
      <div class="setup">
        <div><label for="team">Team name</label><input id="team" maxlength="40" placeholder="e.g., The Elastic Collisions" value="${S.team || ''}"></div>
        <div><label for="names">Team members</label><input id="names" maxlength="120" placeholder="First names" value="${S.names || ''}"></div>
        <div><label for="size">Players</label><select id="size"><option value="3">3 players</option><option value="4" selected>4 players</option></select></div>
        <div><label for="tcode">Class timer code <span class="note">(from the board, if your teacher posted one)</span></label><input id="tcode" maxlength="12" placeholder="e.g., 1452-AB" style="font-family:var(--mono);text-transform:uppercase"></div>
        <div id="tcodeMsg" class="note"></div>
        <p class="note" style="margin:0">Every player opens this page on their own Chromebook and enters the <b>same</b> team name. Bring paper, a pencil, a calculator, and your AP Physics 1 equation sheet.</p>
        <button class="btn dark" id="go">Start the clock ▶</button>
      </div>`;
  $('#size').value = S.size || 4;
  $('#go').addEventListener('click', () => {
    const tc = $('#tcode').value.trim();
    if (tc && !parseTimerCode(tc)) { $('#tcodeMsg').style.color = '#d1495b'; $('#tcodeMsg').textContent = "That timer code isn't valid. Fix it or leave it blank."; return; }
    S.team = $('#team').value.trim() || 'Unnamed Team'; S.names = $('#names').value.trim(); S.size = +$('#size').value;
    if (tc) { const r = parseTimerCode(tc); S.timer = r.type === 'off' ? { off: true, end: null, day: dayKey() } : { off: false, end: r.end, day: dayKey() }; }
    S.started = true; S.start = Date.now(); save(); render();
  });
}

function renderFinale(st) {
  const t = fmt(S.end - S.start);
  st.innerHTML = `<div class="center">
      ${say(`Fine. FINE. You escaped. I'll go back to vacuuming. Show this screen to your teacher.`, 'happy')}
      <div class="cert">
        <div class="tag">Certificate of Escape</div>
        <h2 style="margin:4px 0">${escapeHtml(S.team)}</h2>
        <div class="note">${escapeHtml(S.names || '')}</div>
        <div class="stats"><div>Time<b>${t}</b></div><div>Hints<b>${hintsUsed()}</b></div><div>Wrong codes<b>${S.wrong}</b></div></div>
        <div class="note">Finish code (your teacher types this in)</div>
        <div class="fcode">${finishCode(S.end, Math.min(99, hintsUsed()))}</div>
        <div class="note" style="margin-top:8px">Teacher password</div>
        <div class="pw">${unlockPw()}</div>
        <div class="note">${new Date(S.end).toLocaleString()} · AP Physics 1: Algebra-Based · Unit 4: Linear Momentum · ${ROOM.title}</div>
      </div>
      <p class="no-print"><button class="btn dark" onclick="window.print()">Print certificate</button></p>
    </div>`;
}
function renderTimeUp(st) {
  const opened = S.door;
  st.innerHTML = `<div class="timeup">
      ${say(`Beep boop... <b>TIME'S UP!</b> The lab stays locked. Show this screen to your teacher.`, 'happy')}
      <h2>⏰ Time's Up</h2>
      <div class="cert">
        <h2 style="margin:4px 0;color:var(--ink);font-size:24px">${escapeHtml(S.team)}</h2>

        <div class="stats"><div>Doors opened<b>${opened} / ${ROOM.doors.length}</b></div><div>Hints<b>${hintsUsed()}</b></div><div>Wrong codes<b>${S.wrong}</b></div></div>
        <div class="note">Stopped on Door ${Math.min(opened + 1, ROOM.doors.length)}: ${ROOM.doors[Math.min(opened, ROOM.doors.length - 1)].name}</div>
      </div>
      <p class="note">Did your teacher give more time? Type the new code from the board:</p>
      <form id="moreTime" autocomplete="off" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <input id="moreInput" placeholder="1505-AB" style="font-family:var(--mono);font-size:20px;letter-spacing:.1em;width:180px;padding:8px 10px;border-radius:9px;border:2px solid var(--line);text-transform:uppercase">
        <button class="btn dark" type="submit">Keep going</button></form>
      <div id="moreMsg" class="note" style="margin-top:6px"></div>
    </div>`;
  $('#moreTime').addEventListener('submit', e => { e.preventDefault(); const m = $('#moreMsg'); applyTimerCode($('#moreInput').value, m); if (m.textContent.startsWith('That')) m.style.color = '#d1495b'; });
}
function pwKey(s) { return cyrb53(ROOM.salt + 'pw1::' + s) + cyrb53('pw2::' + s + ROOM.salt) + cyrb53(s + '::pw3' + ROOM.salt); }
function unlockPw() { const k = pwKey(S.key || ''); return ROOM.finaleCipher.map((b, i) => String.fromCharCode(b ^ k.charCodeAt(i % k.length))).join(''); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

$('#timerForm').addEventListener('submit', e => { e.preventDefault(); if (applyTimerCode($('#timerInput').value, $('#timerMsg'))) { $('#timerInput').value = ''; setTimeout(() => $('#timerBox').classList.remove('on'), 1600); } });
$('#timerClose').addEventListener('click', () => $('#timerBox').classList.remove('on'));
$('#resetBtn').addEventListener('click', () => $('#confirmBox').classList.add('on'));
$('#resetNo').addEventListener('click', () => $('#confirmBox').classList.remove('on'));
$('#resetYes').addEventListener('click', () => { store.clear(); S = { started: false, team: '', size: 4, start: 0, end: 0, door: 0, hints: {}, wrong: 0, role: 'A', timer: null }; $('#confirmBox').classList.remove('on'); render(); });
render();
</script>

<script id="cinema-js">
/* VECTOR cinematic layer. Wraps the room engine's render/check without changing answer checking or timer codes.
   Optional per-room script: ROOM.cinema = { open: [lines], doors: [[lines per door]], finale: [lines], taunts: [lines] } */
(function () {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = ROOM.cinema || {};
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };
  const sentences = t => (t.match(/[^.!?]+[.!?]+["”']?|\S[^.!?]*$/g) || [t]).map(s => s.trim()).filter(Boolean);

  /* ---------- sound (synthesized; no files) ---------- */
  const SKEY = 'escape:sound';
  let muted = localStorage.getItem(SKEY) === 'off', ac = null;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, dur = .12, type = 'square', vol = .05, when = 0, slide = 0) {
    if (muted) return; const a = ctx(); if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur = .25, vol = .08, when = 0) {
    if (muted) return; const a = ctx(); if (!a) return;
    const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = a.createBufferSource(), g = a.createGain(), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900;
    s.buffer = b; g.gain.value = vol; s.connect(fl).connect(g).connect(a.destination); s.start(a.currentTime + when);
  }
  const SFX = {
    blip: () => tone(880 + Math.random() * 300, .03, 'square', .018),
    slam: () => { noise(.35, .18); tone(70, .3, 'sine', .2, 0, -30); },
    alert: () => { tone(660, .12, 'square', .04); tone(660, .12, 'square', .04, .2); tone(990, .25, 'square', .04, .4); },
    click: () => { tone(1500, .04, 'square', .05); tone(500, .06, 'triangle', .06, .05); },
    creak: () => tone(140, .9, 'sawtooth', .025, 0, 90),
    unlock: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .07, i * .08)); },
    buzz: () => { tone(110, .35, 'sawtooth', .07); tone(116, .35, 'sawtooth', .05); },
    hint: () => { tone(740, .1, 'sine', .05); tone(988, .18, 'sine', .05, .1); },
    power: () => tone(600, 1.2, 'sawtooth', .05, 0, -560),
    fanfare: () => { [[523, 0], [659, .12], [784, .24], [1047, .36], [784, .6], [1047, .72]].forEach(([f, w]) => { tone(f, .3, 'triangle', .08, w); tone(f / 2, .3, 'sine', .05, w); }); },
    beep: () => { tone(1200, .09, 'square', .04); tone(1200, .09, 'square', .04, .15); }
  };

  /* ---------- big VECTOR ---------- */
  function bigBot(mood = 'smug') {
    const eyes = mood === 'dead'
      ? '<path d="M66 70 l16 16 M82 70 l-16 16 M118 70 l16 16 M134 70 l-16 16" stroke="#0d1b2a" stroke-width="6" stroke-linecap="round"/>'
      : `<ellipse class="eye" cx="74" cy="78" rx="10" ry="11" fill="#0d1b2a"/><ellipse class="eye" cx="126" cy="78" rx="10" ry="11" fill="#0d1b2a"/><circle cx="78" cy="74" r="3" fill="#fff"/><circle cx="130" cy="74" r="3" fill="#fff"/>` +
        (mood === 'mad' ? '<path d="M58 58 l26 10 M142 58 l-26 10" stroke="#0d1b2a" stroke-width="7" stroke-linecap="round"/>' : '') +
        (mood === 'smug' ? '<path d="M60 64 q14 -6 28 0 M112 64 q14 -6 28 0" stroke="#0d1b2a" stroke-width="5" fill="none" stroke-linecap="round"/>' : '');
    const mouth = mood === 'happy' ? '<path d="M78 112 q22 20 44 0" stroke="#0d1b2a" stroke-width="7" fill="none" stroke-linecap="round"/>'
      : mood === 'mad' ? '<path d="M80 120 q20 -14 40 0" stroke="#0d1b2a" stroke-width="7" fill="none" stroke-linecap="round"/>'
      : mood === 'dead' ? '<path d="M80 116 q10 -8 20 0 q10 8 20 0" stroke="#0d1b2a" stroke-width="6" fill="none" stroke-linecap="round"/>'
      : '<path d="M80 114 q24 10 44 -6" stroke="#0d1b2a" stroke-width="7" fill="none" stroke-linecap="round"/>';
    const brush = (cls, x) => `<g class="${cls}"><g stroke="#f4a259" stroke-width="4" stroke-linecap="round">${[0, 60, 120, 180, 240, 300].map(a => `<line x1="${x}" y1="98" x2="${x + 22 * Math.cos(a * Math.PI / 180)}" y2="${98 + 22 * Math.sin(a * Math.PI / 180)}"/>`).join('')}</g><circle cx="${x}" cy="98" r="6" fill="#0f8b8d"/></g>`;
    return `<svg viewBox="-10 -20 220 220" aria-hidden="true">${mood === 'dead' ? '' : brush('brush', 22) + brush('brush2', 178)}
      <ellipse cx="100" cy="186" rx="72" ry="10" fill="#000" opacity=".25"/>
      <circle cx="100" cy="100" r="82" fill="#7ee8e0"/><circle cx="100" cy="100" r="82" fill="none" stroke="#0f8b8d" stroke-width="8"/>
      <circle cx="100" cy="100" r="64" fill="none" stroke="#0f8b8d" stroke-width="2" opacity=".35"/>
      <rect x="50" y="62" width="100" height="34" rx="17" fill="#0d1b2a" opacity=".12"/>${eyes}${mouth}
      <line x1="100" y1="18" x2="100" y2="-4" stroke="#0f8b8d" stroke-width="6"/><circle class="${mood === 'dead' ? '' : 'ant'}" cx="100" cy="-8" r="9" fill="${mood === 'dead' ? '#555' : '#f4a259'}"/></svg>`;
  }

  /* ---------- cutscene player ---------- */
  let playing = null;
  function scene(build) {
    return new Promise(resolve => {
      const el = document.createElement('div'); el.className = 'cine'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Cutscene');
      el.innerHTML = '<div class="grid"></div><div class="bar t"></div><div class="bar b"></div><div class="scene"></div><button class="skip" type="button">Skip ⏭</button>';
      document.body.appendChild(el); requestAnimationFrame(() => el.classList.add('on'));
      let advance = null, done = false;
      const finish = () => { if (done) return; done = true; document.removeEventListener('keydown', key); el.classList.remove('on'); setTimeout(() => el.remove(), 350); playing = null; resolve(); };
      const key = e => { if (e.key === 'Escape') finish(); else if ((e.key === ' ' || e.key === 'Enter') && advance) { e.preventDefault(); advance(); } };
      document.addEventListener('keydown', key);
      el.querySelector('.skip').addEventListener('click', e => { e.stopPropagation(); finish(); });
      el.addEventListener('click', () => advance && advance());
      const api = {
        root: el, stage: el.querySelector('.scene'), done: () => done, finish,
        wait: ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 150) : ms)),
        tap: (ms = 0) => new Promise(r => { const tn = el.querySelector('.tapnext'); if (tn) tn.classList.add('on'); let t = null; advance = () => { advance = null; clearTimeout(t); if (tn) tn.classList.remove('on'); r(); }; if (ms) t = setTimeout(() => advance && advance(), ms); }),
        type: async (node, text, speed = 24) => {
          node.innerHTML = '<span></span><i class="caret"></i>'; const sp = node.firstChild; let skipped = false;
          advance = () => { skipped = true; };
          for (let i = 0; i < text.length && !done; i++) { if (skipped || RM) { sp.textContent = text; break; } sp.textContent = text.slice(0, i + 1); if (i % 2 === 0 && /\S/.test(text[i])) SFX.blip(); await new Promise(r => setTimeout(r, /[.,!?:]/.test(text[i]) ? speed * 6 : speed)); }
          advance = null; node.querySelector('.caret').remove();
        }
      };
      playing = api;
      build(api).then(finish, finish);
    });
  }

  async function lines(s, list, mood) {
    s.stage.insertAdjacentHTML('beforeend', `<div class="bubble"><div class="who">VECTOR</div><div class="txt"></div></div><div class="tapnext">click or press space ▸</div>`);
    const txt = s.stage.querySelector('.bubble .txt');
    for (const L of list) { if (s.done()) return; await s.type(txt, L); await s.tap(L.length * 55 + 2600); }
  }

  /* ---------- 1. cold open ---------- */
  async function playOpen() {
    const intro = C.open || sentences(strip(ROOM.intro)).slice(0, 4);
    await scene(async s => {
      SFX.alert();
      s.stage.innerHTML = `<div class="alert">⚠ SYSTEM ALERT · ALL DOORS LOCKED ⚠</div><div class="bot rollin">${bigBot('smug')}</div>
        <div class="kick">${escapeHtml(document.title.split('·').slice(1, -1).join('·').trim() || 'Escape Room')}</div>
        <h1 class="ttl">${[...ROOM.title].map((c, i) => `<span style="animation-delay:${.9 + i * .04}s">${c === ' ' ? '&nbsp;' : escapeHtml(c)}</span>`).join('')}</h1>`;
      setTimeout(SFX.slam, RM ? 0 : 1200);
      await s.wait(1300 + ROOM.title.length * 40);
      s.stage.querySelector('.bot').classList.replace('rollin', 'bob');
      await lines(s, intro);
      if (s.done()) return;
      s.stage.querySelector('.txt').textContent = `${ROOM.doors.length} doors. One team. Let's see how long you last. Mwahaha.`;
      SFX.slam(); await s.wait(1500);
    });
  }

  /* ---------- 2. door unlock ---------- */
  async function playDoor(i, vals) {
    const d = ROOM.doors[i], nx = ROOM.doors[i + 1];
    const extra = (C.doors && C.doors[i]) || [];
    await scene(async s => {
      s.stage.innerHTML = `<div class="codereel">${vals.map((v, k) => `<b style="animation-delay:${k * .12}s">${escapeHtml(v || '·')}</b>`).join('')}</div>
        <div class="doorwrap"><div class="doorlight"></div><div class="leaf l"></div><div class="leaf r"></div><div class="num">DOOR ${i + 1}</div>
        <svg class="lockicon" viewBox="0 0 88 88"><path class="shackle" d="M26 40 V26 a18 18 0 0 1 36 0 V40" fill="none" stroke="#f4a259" stroke-width="8"/><rect x="16" y="38" width="56" height="42" rx="8" fill="#f4a259"/><circle cx="44" cy="58" r="6" fill="#14213d"/></svg></div>
        <div class="next">${nx ? 'Next · Door ' + (i + 2) + ' of ' + ROOM.doors.length : 'Final door cracked'}</div><h2 class="nextname">${nx ? escapeHtml(nx.name) : ''}</h2>`;
      const w = s.stage.querySelector('.doorwrap');
      await s.wait(500 + vals.length * 120); SFX.click(); w.classList.add('unlocked');
      await s.wait(350); SFX.creak(); w.classList.add('open');
      await s.wait(500); SFX.unlock(); sparks(w);
      await s.wait(700);
      s.stage.querySelector('.next').classList.add('on'); s.stage.querySelector('.nextname').classList.add('on');
      const said = extra.length ? extra : [strip(d.success || '').replace(/\s*(Door|Final door)\s*\d*\s*(is\s*)?(unlocked|open(ed)?)[.!]*\s*$/i, '').trim()].filter(Boolean);
      if (said.length) { await s.wait(300); await lines(s, said); }
      else await s.wait(1500);
    });
  }

  function sparks(el) {
    if (RM) return; const r = el.getBoundingClientRect();
    for (let k = 0; k < 26; k++) {
      const p = document.createElement('i'); p.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160;
      p.style.left = (r.left + r.width / 2) + 'px'; p.style.top = (r.top + r.height / 2) + 'px'; p.style.position = 'fixed';
      p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      (playing ? playing.root : document.body).appendChild(p); setTimeout(() => p.remove(), 800);
    }
  }

  /* ---------- 3. finale ---------- */
  async function playFinale() {
    const fin = C.finale || ['No. No no no. My firmware was PERFECT.', 'Fine. FINE. You escaped. I\'m going back to vacuuming…'];
    await scene(async s => {
      s.stage.innerHTML = `<div class="bot bob">${bigBot('mad')}</div>`;
      await lines(s, fin.slice(0, 1));
      if (s.done()) return;
      SFX.power(); const b = s.stage.querySelector('.bot'); b.innerHTML = bigBot('dead'); b.classList.replace('bob', 'dead');
      await s.wait(1500);
      s.stage.innerHTML = `<div class="stamp">ESCAPED!</div><div class="tally">0:00</div><div class="kick" style="animation-delay:.6s">${escapeHtml(S.team || '')}</div><div class="tapnext">click to see your certificate ▸</div>`;
      SFX.slam(); SFX.fanfare(); confetti(s.root);
      const T = Math.max(0, Math.floor((S.end - S.start) / 1000)), el = s.stage.querySelector('.tally'), t0 = performance.now();
      await new Promise(r => { const step = now => { const k = Math.min(1, (now - t0) / (RM ? 1 : 1400)), v = Math.round(T * (1 - Math.pow(1 - k, 3))); el.textContent = Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0'); if (k < 1 && !s.done()) requestAnimationFrame(step); else r(); }; requestAnimationFrame(step); });
      await s.tap(9000);
    });
  }

  function confetti(root) {
    if (RM) return; const cv = document.createElement('canvas'); cv.className = 'confetti'; root.appendChild(cv);
    const g = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, cols = ['#7ee8e0', '#f4a259', '#fbf8f1', '#d1495b', '#0f8b8d'];
    const P = Array.from({ length: 180 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: H * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4, r: Math.random() * 6 + 3, a: Math.random() * 6, c: cols[Math.random() * 5 | 0] }));
    let t = 0; (function f() { g.clearRect(0, 0, W, H); P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }); if (++t < 260 && root.isConnected) requestAnimationFrame(f); })();
  }

  /* ---------- 4. in-room cameos ---------- */
  const cam = document.createElement('div'); cam.className = 'cameo'; cam.setAttribute('aria-hidden', 'true'); document.body.appendChild(cam);
  let camT = null;
  function cameo(text, mood = 'mad', label = 'VECTOR', ms = 3200) {
    cam.className = 'cameo' + (mood === 'happy' ? ' nice' : '');
    cam.innerHTML = `<div class="cb"><b>${label}</b>${escapeHtml(text)}</div>${bigBot(mood)}`;
    requestAnimationFrame(() => cam.classList.add('on')); clearTimeout(camT); camT = setTimeout(() => cam.classList.remove('on'), ms);
  }
  const taunts = C.taunts || ['Still stuck? My battery could do this in its sleep mode.', 'Tick tock. I am vacuuming your confidence.', 'Have you tried… being correct?', 'Fun fact: hints are free. My respect is not.', 'I can hear you thinking. It sounds like a dust bin.'];
  let lastActivity = Date.now(), tauntDoor = -1;
  ['keydown', 'click'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, true));
  setInterval(() => {
    if (!S.started || S.end || playing || timeUp()) return;
    if (Date.now() - lastActivity > 150000 && tauntDoor !== S.door) { tauntDoor = S.door; cameo(taunts[Math.random() * taunts.length | 0], 'smug', 'VECTOR', 4500); }
    const glow = document.querySelector('.alarmglow'), left = timerLive() ? S.timer.end - Date.now() : Infinity;
    const low = left > 0 && left < 120000; glow.classList.toggle('on', low && !RM);
    if (low && !glow.dataset.beeped) { glow.dataset.beeped = 1; SFX.beep(); cameo('Two minutes left! My victory is SO close.', 'smug', 'VECTOR', 4000); }
  }, 5000);

  /* ---------- 5. wrap the engine ---------- */
  const _render = render, _check = check, _renderIntro = renderIntro;
  let shownOpen = sessionStorage.getItem('cine-open:' + ROOM.id) === '1';
  check = function (d, i) {
    const form = $('#lockForm'); const vals = d.fields.map((f, k) => String(form.elements['f' + k].value).trim());
    const before = S.door, wrongBefore = S.wrong;
    const realTimeout = window.setTimeout;
    let queued = null;
    window.setTimeout = (fn, ms) => { if (fn === render && ms === 1400) { queued = true; return 0; } return realTimeout(fn, ms); };
    try { _check(d, i); } finally { window.setTimeout = realTimeout; }
    if (S.door > before) {
      SFX.click();
      realTimeout(async () => {
        await playDoor(i, vals);
        if (S.door >= ROOM.doors.length) await playFinale();
        render();
        const pill = document.querySelectorAll('.door-pill')[i]; if (pill) pill.classList.add('justopen');
      }, 500);
    } else if (S.wrong > wrongBefore) {
      SFX.buzz(); const fb = $('#fb'); cameo(fb ? fb.textContent.replace(/^✖\s*/, '') : 'Wrong!', 'mad', 'Access denied');
      if (!RM) { const p = document.querySelector('.panel'); p.classList.remove('shakeall'); void p.offsetWidth; p.classList.add('shakeall'); }
    }
  };
  renderIntro = function (st) {
    _renderIntro(st);
    const go = $('#go');
    if (go) go.addEventListener('click', () => { ctx(); SFX.slam(); }, true);
    if (!shownOpen) { shownOpen = true; sessionStorage.setItem('cine-open:' + ROOM.id, '1'); setTimeout(playOpen, 250); }
  };
  render = function () {
    _render();
    document.querySelectorAll('[data-hint]').forEach(b => b.addEventListener('click', () => { SFX.hint(); cameo('A hint? How adorable. Fine, here.', 'smug', 'VECTOR', 2600); }, true));
  };

  /* ---------- chrome: sound toggle, patrol bot, alarm glow, replay ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div class="alarmglow"></div><div class="patrol" aria-hidden="true">${bigBot('smug')}</div>
    <button class="soundbtn no-print" type="button" title="Sound on/off" aria-label="Toggle sound">${muted ? '🔇' : '🔊'}</button>`);
  const sb = document.querySelector('.soundbtn');
  sb.addEventListener('click', () => { muted = !muted; localStorage.setItem(SKEY, muted ? 'off' : 'on'); sb.textContent = muted ? '🔇' : '🔊'; if (!muted) { ctx(); SFX.blip(); } });
  window.replayIntro = playOpen;
  render();
})();
</script>
<!-- CINEMA:end -->
</body>
