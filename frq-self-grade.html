<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRQ Self-Grade</title>
<meta name="description" content="Grade your own AP Physics free-response answers against the scoring criteria and turn in your self-scores.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3d5afe">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe0; --text: #1c1e21; --dim: #5f6670;
    --accent: #3d5afe; --accent-text: #fff; --soft: #eef1f7; --sel: #e4e9fb;
    --good: #1f8f5f; --good-bg: #e3f5ec; --bad: #c0392b; --bad-bg: #fbe9e7; --warn: #a86a12; --warn-bg: #fdf3e2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1f2226; --border: #33373d; --text: #e7e9ea; --dim: #9aa0a6;
      --accent: #5b7bff; --soft: #2a2d33; --sel: #2e3550;
      --good: #4cc98f; --good-bg: #173326; --bad: #ff8a7a; --bad-bg: #3a1f1c; --warn: #e0a84a; --warn-bg: #382a14;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header .who { font-size: 14px; color: var(--dim); }
  header .spacer { flex: 1; }
  button, .btn { font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 7px; padding: 8px 14px; display: inline-block; }
  button:hover, .btn:hover { background: var(--soft); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=file] { display: none; }

  #gate { max-width: 440px; margin: 10vh auto 0; padding: 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  #gate h2 { margin: 0 0 6px; font-size: 20px; }
  #gate p { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
  #codeInput { width: 100%; font: 600 26px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  #gate .row { display: flex; gap: 8px; margin-top: 12px; }
  #gate .row button { flex: 1; }
  #gateMsg { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--bad); }

  #app { display: none; }
  #layout { display: flex; gap: 0; align-items: stretch; }
  #paperPane { flex: 1 1 55%; min-width: 0; display: none; border-right: 1px solid var(--border); background: #5f6368; position: sticky; top: 57px; height: calc(100vh - 57px); }
  #paperPane iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #gradePane { flex: 1 1 45%; min-width: 0; max-width: 820px; margin: 0 auto; padding: 16px 16px 60px; }
  body.with-paper #paperPane { display: block; }
  body.with-paper #gradePane { max-width: 560px; margin: 0; }

  .intro { font-size: 14px; color: var(--dim); line-height: 1.55; margin: 2px 0 14px; }
  .q { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .q > h2 { margin: 0; padding: 12px 16px; font-size: 16px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border); background: var(--soft); }
  .q > h2 .score { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--dim); white-space: nowrap; }
  .part { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .part:last-child { border-bottom: none; }
  .part h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); display: flex; gap: 8px; }
  .part h3 .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .pt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 8px; cursor: pointer; user-select: none; }
  .pt:hover { background: var(--soft); }
  .pt .box { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: transparent; }
  .pt.on .box { background: var(--good); border-color: var(--good); color: #fff; }
  .pt .txt { font-size: 14px; line-height: 1.45; padding-top: 4px; }
  .pt .pid { font-weight: 700; margin-right: 6px; }

  /* results */
  .res { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: center; padding: 7px 8px; border-radius: 8px; font-size: 14px; line-height: 1.45; }
  .res + .res { margin-top: 3px; }
  .res.agree { background: transparent; }
  .res.diff { background: var(--warn-bg); }
  .res .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; text-align: center; min-width: 74px; }
  .tag.y { background: var(--good-bg); color: var(--good); }
  .tag.n { background: var(--bad-bg); color: var(--bad); }
  .res .note { grid-column: 1 / -1; font-size: 13px; color: var(--dim); padding-left: 2px; }
  .colhead { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); padding: 0 8px 4px; }
  .colhead span:not(:first-child) { min-width: 74px; text-align: center; }
  .fb { margin-top: 10px; font-size: 14px; line-height: 1.55; background: var(--sel); border-radius: 8px; padding: 10px 12px; }
  .fb b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); margin-bottom: 2px; }

  #lockBar { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); }
  #lockBar .tot { font-size: 15px; }
  #lockBar .tot b { font-size: 20px; }
  #lockBar .spacer { flex: 1; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat .lbl { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .val { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .stat .val small { font-size: 14px; font-weight: 500; color: var(--dim); }
  #reflect { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  #reflect h2 { font-size: 16px; margin: 0 0 4px; }
  #reflect p { font-size: 14px; color: var(--dim); margin: 0 0 8px; line-height: 1.5; }
  #reflect textarea { width: 100%; min-height: 90px; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20; }
  #toast.show { opacity: 0.95; }

  @media (max-width: 860px) {
    #layout { flex-direction: column; }
    #paperPane { position: static; height: 70vh; border-right: none; border-bottom: 1px solid var(--border); }
    body.with-paper #gradePane { max-width: none; }
  }
  @media print {
    header, #lockBar, .actions, #paperPane, .noprint { display: none !important; }
    #gradePane { max-width: none; padding: 0; }
    .q, .stat, #reflect { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>✅ <span id="testTitle">FRQ</span> Self-Grade</h1>
  <span class="who" id="who"></span>
  <div class="spacer"></div>
  <label class="btn noprint" id="paperBtn" for="paperInput" style="display:none">Open my paper (PDF)</label>
  <input type="file" id="paperInput" accept="application/pdf,image/*">
  <button id="signOut" class="noprint" style="display:none">Sign out</button>
</header>

<div id="gate">
  <div class="card">
    <h2>Grade your own FRQs</h2>
    <p>Enter the code from your slip. You'll go through the scoring criteria and score your own answers point by point, then turn in your self-scores.</p>
    <input id="codeInput" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Your code">
    <div class="row"><button class="primary" id="openBtn">Open</button></div>
    <div id="gateMsg" role="status"></div>
  </div>
</div>

<div id="app">
  <div id="layout">
    <div id="paperPane"><iframe id="paperFrame" title="Your paper"></iframe></div>
    <div id="gradePane">
      <div id="gradeView"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  var TEST = (new URLSearchParams(location.search).get("test") || "unit3").replace(/[^a-z0-9_-]/gi, "");
  var DATA = null, REC = null, RID = null, ST = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("show"); }, 2200); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  // ---------- Unlocking ----------
  var codeInput = $("codeInput");
  codeInput.addEventListener("input", function () {
    var v = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    codeInput.value = v.length > 4 ? v.slice(0, 4) + "-" + v.slice(4) : v;
    $("gateMsg").textContent = "";
  });
  codeInput.addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
  $("openBtn").addEventListener("click", unlock);

  async function loadData() {
    if (DATA) return DATA;
    var r = await fetch("self-grade/" + TEST + ".json", { cache: "no-cache" });
    if (!r.ok) throw new Error("missing");
    DATA = await r.json();
    $("testTitle").textContent = DATA.title;
    document.title = DATA.title + " Self-Grade";
    return DATA;
  }
  async function unlock(evt, silentCode) {
    var code = (silentCode || codeInput.value).toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 8) { $("gateMsg").textContent = "Your code has 8 letters and numbers."; return; }
    if (!window.crypto || !crypto.subtle) { $("gateMsg").textContent = "This browser can't open codes. Try Chrome, Safari, Edge or Firefox."; return; }
    $("openBtn").disabled = true; $("openBtn").textContent = "Checking…";
    try {
      var d = await loadData();
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]);
      var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(d.kdf.salt), iterations: d.kdf.iterations }, base, 384));
      var id = b64(bits.slice(0, 16)), rec = d.records[id];
      if (!rec) { $("gateMsg").textContent = "That code didn't match. Check it against your slip (no letter O or I, no 0 or 1)."; return; }
      var key = await crypto.subtle.importKey("raw", bits.slice(16), "AES-GCM", false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(rec.iv) }, key, unb64(rec.ct));
      REC = JSON.parse(new TextDecoder().decode(plain)); RID = id;
      try { sessionStorage.setItem("sg_code_" + TEST, code); } catch (e) {}
      start();
    } catch (e) {
      $("gateMsg").textContent = e && e.message === "missing" ? "This test isn't set up yet. Check the link with your teacher." : "Something went wrong opening your code. Reload and try again.";
    } finally { $("openBtn").disabled = false; $("openBtn").textContent = "Open"; }
  }

  // ---------- Self-grading state (kept in this browser) ----------
  function skey() { return "sg_" + TEST + "_" + RID; }
  function start() {
    ST = store(skey()) || { self: {}, locked: false, reflection: "" };
    DATA.questions.forEach(function (q) { if (!ST.self[q.id]) ST.self[q.id] = {}; });
    $("gate").style.display = "none"; $("app").style.display = "block";
    $("who").textContent = "Student #" + REC.number + " · " + REC.period;
    $("paperBtn").style.display = ""; $("signOut").style.display = "";
    render();
  }
  function save() { store(skey(), ST); }
  $("signOut").addEventListener("click", function () {
    try { sessionStorage.removeItem("sg_code_" + TEST); } catch (e) {}
    location.reload();
  });

  // ---------- Paper (stays on this device) ----------
  $("paperInput").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var fr = $("paperFrame");
    if (fr.dataset.url) URL.revokeObjectURL(fr.dataset.url);
    var url = URL.createObjectURL(f); fr.dataset.url = url;
    if (/^image\//.test(f.type)) fr.srcdoc = '<body style="margin:0;background:#5f6368"><img src="' + url + '" style="width:100%;display:block"></body>';
    else { fr.removeAttribute("srcdoc"); fr.src = url; }
    document.body.classList.add("with-paper");
    $("paperBtn").textContent = "Change paper";
  });

  // ---------- Rendering ----------
  function sum(obj, ids) { return ids.reduce(function (s, k) { return s + (obj[k] ? 1 : 0); }, 0); }
  function ids(list) { return list.map(function (p) { return p.id; }); }
  function allIds(q) { var o = []; q.parts.forEach(function (p) { o = o.concat(ids(p.points)); }); return o; }

  function render() { if (ST.locked) renderResults(); else renderSelf(); window.scrollTo(0, 0); }

  function renderSelf() {
    var html = '<p class="intro">Go through each point. Tick it only if your answer clearly does what the point describes. When you\'re done, lock in your scores and download the file to turn in. ' +
      '<b>You can\'t change your scores after you lock them in.</b> Have your paper in front of you, or use <b>Open my paper</b> at the top. It stays on your device.</p>';
    DATA.questions.forEach(function (q) {
      html += '<section class="q"><h2>' + esc(q.name) + '<span class="score" data-qs="' + esc(q.id) + '"></span></h2>';
      q.parts.forEach(function (p) {
        html += '<div class="part"><h3>Part ' + esc(p.label) + '<span class="sub" data-ps="' + esc(q.id + "|" + p.label) + '"></span></h3>';
        p.points.forEach(function (pt) {
          var on = !!ST.self[q.id][pt.id];
          html += '<div class="pt' + (on ? " on" : "") + '" role="checkbox" tabindex="0" aria-checked="' + on + '" data-q="' + esc(q.id) + '" data-p="' + esc(pt.id) + '"><span class="box">✓</span><span class="txt"><span class="pid">' + esc(pt.id) + '</span>' + esc(pt.criterion) + '</span></div>';
        });
        html += '</div>';
      });
      html += '</section>';
    });
    html += '<div id="lockBar"><span class="tot" id="selfTot"></span><span class="spacer"></span><button class="primary" id="lockBtn">Lock in my scores</button></div>';
    $("gradeView").innerHTML = html;
    document.querySelectorAll(".pt").forEach(function (el) {
      function flip() {
        var q = el.dataset.q, p = el.dataset.p;
        ST.self[q][p] = ST.self[q][p] ? 0 : 1;
        el.classList.toggle("on", !!ST.self[q][p]); el.setAttribute("aria-checked", !!ST.self[q][p]);
        save(); updateSelfTotals(); disarm();
      }
      el.addEventListener("click", flip);
      el.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
    });
    var lb = $("lockBtn");
    function disarm() { lb.dataset.armed = ""; lb.textContent = "Lock in my scores"; }
    lb.addEventListener("click", function () {
      if (lb.dataset.armed !== "1") { lb.dataset.armed = "1"; lb.textContent = "Sure? Click again to lock in"; return; }
      ST.locked = true; ST.lockedAt = new Date().toISOString(); save(); render();
      toast("Locked in. Now download your self-grade to turn in.");
    });
    updateSelfTotals();
  }
  function updateSelfTotals() {
    var grand = 0, max = 0;
    DATA.questions.forEach(function (q) {
      var s = sum(ST.self[q.id], allIds(q)); grand += s; max += q.total;
      var el = document.querySelector('[data-qs="' + q.id + '"]'); if (el) el.textContent = "You: " + s + " / " + q.total;
      q.parts.forEach(function (p) {
        var e2 = document.querySelector('[data-ps="' + q.id + "|" + p.label + '"]');
        if (e2) e2.textContent = sum(ST.self[q.id], ids(p.points)) + " / " + p.points.length;
      });
    });
    $("selfTot").innerHTML = "Your score: <b>" + grand + "</b> / " + max;
  }

  function renderResults() {
    var gs = 0, max = 0, html = "";
    DATA.questions.forEach(function (q) { gs += sum(ST.self[q.id], allIds(q)); max += q.total; });
    html += '<div class="summary">' +
      DATA.questions.map(function (q) { return '<div class="stat"><div class="lbl">' + esc(q.id) + '</div><div class="val">' + sum(ST.self[q.id], allIds(q)) + ' <small>/ ' + q.total + '</small></div></div>'; }).join("") +
      '<div class="stat"><div class="lbl">Your total</div><div class="val">' + gs + ' <small>/ ' + max + '</small></div></div></div>';
    html += '<div id="reflect"><h2>Your scores are locked in</h2><p><b>Download your self-grade and turn it in where your teacher asks.</b> This is your own score; your teacher will compare it with theirs.</p>' +
      '<p>Optional: which point were you least sure about, and why?</p>' +
      '<textarea id="reflectText" placeholder="I wasn\'t sure about B2 because…"></textarea>' +
      '<div class="actions"><button class="primary" id="dlBtn">Download my self-grade</button><button id="printBtn">Print</button></div></div>';
    DATA.questions.forEach(function (q) {
      html += '<section class="q"><h2>' + esc(q.name) + '<span class="score">You: ' + sum(ST.self[q.id], allIds(q)) + ' / ' + q.total + '</span></h2>';
      q.parts.forEach(function (p) {
        var pi = ids(p.points);
        html += '<div class="part"><h3>Part ' + esc(p.label) + '<span class="sub">' + sum(ST.self[q.id], pi) + ' / ' + pi.length + '</span></h3>';
        p.points.forEach(function (pt) {
          var me = !!ST.self[q.id][pt.id];
          html += '<div class="res agree" style="grid-template-columns:1fr auto"><span><span class="pid" style="font-weight:700;margin-right:6px">' + esc(pt.id) + '</span>' + esc(pt.criterion) + '</span>' +
            '<span class="tag ' + (me ? "y" : "n") + '">' + (me ? "✓ earned" : "✗ not") + '</span></div>';
        });
        html += '</div>';
      });
      html += '</section>';
    });
    $("gradeView").innerHTML = html;
    var rt = $("reflectText"); rt.value = ST.reflection || "";
    rt.addEventListener("input", function () { ST.reflection = rt.value; save(); });
    $("printBtn").addEventListener("click", function () { window.print(); });
    $("dlBtn").addEventListener("click", download);
  }

  function download() {
    var rows = [["Test", "Period", "Student #", "Question", "Grader question", "Points earned", "Total", "Out of", "Locked at", "Note"]];
    DATA.questions.forEach(function (q) {
      var earned = allIds(q).filter(function (k) { return ST.self[q.id][k]; });
      rows.push([DATA.test, REC.period, REC.number, q.id, q.type || q.id, earned.join(" "), earned.length, q.total, ST.lockedAt || "", ST.reflection || ""]);
    });
    var csv = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(","); }).join("\n");
    var name = DATA.test + "_selfgrade_" + REC.period + "_" + REC.number + ".csv";
    try {
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast("Downloaded " + name + ". Turn it in where your teacher asks.");
    } catch (e) { toast("Your browser blocked the download. Use Print instead."); }
  }

  // Reopen after a reload in the same tab without retyping the code.
  try { var saved = sessionStorage.getItem("sg_code_" + TEST); if (saved) unlock(null, saved); } catch (e) {}
  loadData().catch(function () {});
  codeInput.focus();
})();
</script>
</body>
</html>
