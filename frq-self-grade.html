<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRQ Self-Grade</title>
<meta name="description" content="Practice grading AP Physics free-response answers against Mr. C's scoring, then grade your own.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3d5afe">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #d8dbe0; --text: #1c1e21; --dim: #5f6670;
    --accent: #3d5afe; --accent-text: #fff; --soft: #eef1f7; --sel: #e4e9fb;
    --good: #1f8f5f; --good-bg: #e3f5ec; --bad: #c0392b; --bad-bg: #fbe9e7; --warn: #a86a12; --warn-bg: #fdf3e2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1f2226; --border: #33373d; --text: #e7e9ea; --dim: #9aa0a6;
      --accent: #5b7bff; --soft: #2a2d33; --sel: #2e3550;
      --good: #4cc98f; --good-bg: #173326; --bad: #ff8a7a; --bad-bg: #3a1f1c; --warn: #e0a84a; --warn-bg: #382a14;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .who { font-size: 14px; color: var(--dim); }
  header .spacer { flex: 1; }
  #sync { font-size: 12px; color: var(--dim); }
  #sync.bad { color: var(--warn); }
  button { font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 7px; padding: 8px 14px; }
  button:hover { background: var(--soft); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select { font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; }

  /* sign in */
  #signin { max-width: 440px; margin: 8vh auto 40px; padding: 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  #signin h2 { margin: 0 0 6px; font-size: 20px; }
  #signin p { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
  label.f { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
  #classCode, #unlockInput { font: 600 22px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; }
  #step2 { display: none; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--bad); }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row button { flex: 1; }

  /* steps */
  #app { display: none; }
  #steps { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 13px; }
  #steps .grp { font-weight: 700; color: var(--dim); margin: 0 2px 0 10px; }
  #steps .grp:first-child { margin-left: 0; }
  .chip { border: 1px solid var(--border); border-radius: 14px; padding: 3px 10px; color: var(--dim); background: var(--panel); font-size: 13px; }
  .chip.done { background: var(--good-bg); border-color: transparent; color: var(--good); cursor: pointer; }
  .chip.off { background: var(--warn-bg); border-color: transparent; color: var(--warn); cursor: pointer; }
  .chip.now { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .chip.viewing { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip.later { opacity: .55; }

  #layout { display: flex; align-items: flex-start; }
  #paperPane { flex: 1 1 58%; min-width: 0; border-right: 1px solid var(--border); background: #5f6368; position: sticky; top: 0; height: 100vh; overflow: auto; display: none; }
  #paperPane .tools { position: sticky; top: 0; display: flex; gap: 6px; padding: 6px; background: rgba(40,42,46,.9); z-index: 2; }
  #paperPane .tools button { padding: 4px 10px; font-size: 13px; background: #3a3d42; color: #fff; border-color: #555; }
  #paperPane .tools span { color: #ddd; font-size: 13px; align-self: center; margin-left: 6px; }
  #pages { padding: 8px; }
  #pages img { display: block; width: 100%; max-width: none; margin: 0 auto 8px; background: #fff; }
  #pages .loading { color: #eee; padding: 30px; text-align: center; font-size: 14px; }
  #main { flex: 1 1 42%; min-width: 0; max-width: 820px; margin: 0 auto; padding: 16px 16px 80px; }
  body.with-paper #paperPane { display: block; }
  body.with-paper #main { max-width: 600px; margin: 0; }
  @media (max-width: 900px) {
    #layout { flex-direction: column; align-items: stretch; }
    #paperPane { position: relative; height: 70vh; border-right: 0; border-bottom: 1px solid var(--border); }
    body.with-paper #main { max-width: none; }
  }

  h2.title { font-size: 19px; margin: 0 0 4px; }
  .intro { font-size: 14px; color: var(--dim); line-height: 1.55; margin: 4px 0 14px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .part { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .part:last-child { border-bottom: none; }
  .part h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
  .pt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 7px 6px; border-radius: 8px; cursor: pointer; user-select: none; }
  .pt:hover { background: var(--soft); }
  .pt .cb { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: transparent; }
  .pt.on .cb { background: var(--good); border-color: var(--good); color: #fff; }
  .pt .txt { font-size: 14px; line-height: 1.45; padding-top: 4px; }
  .pid { font-weight: 700; margin-right: 6px; }
  .total { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 15px; background: var(--soft); }
  .total b { font-size: 18px; }
  textarea { font: inherit; font-size: 14px; width: 100%; min-height: 60px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }

  /* comparison */
  .cmp { padding: 4px 6px; }
  .cmp details { border-radius: 8px; }
  .cmp details + details { margin-top: 2px; }
  .cmp details.miss { background: var(--warn-bg); }
  .cmp summary { display: grid; grid-template-columns: 1fr 52px 52px 14px; gap: 8px; align-items: center; padding: 7px 8px; cursor: pointer; list-style: none; font-size: 14px; line-height: 1.4; }
  .cmp summary::-webkit-details-marker { display: none; }
  .cmp summary .arrow { color: var(--dim); transition: transform .15s; font-size: 11px; }
  .cmp details[open] .arrow { transform: rotate(90deg); }
  .cmp .why { padding: 0 10px 10px 10px; font-size: 14px; line-height: 1.5; }
  .cmp .why b { color: var(--dim); font-weight: 600; }
  .cmp .head { display: grid; grid-template-columns: 1fr 52px 52px 14px; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); padding: 8px 8px 2px; }
  .cmp .head span { text-align: center; }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 0; border-radius: 10px; text-align: center; display: inline-block; }
  .tag.y { background: var(--good-bg); color: var(--good); }
  .tag.n { background: var(--bad-bg); color: var(--bad); }
  .sumrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 96px; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .stat .v { font-size: 20px; font-weight: 700; }
  .banner { border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin: 12px 0 14px; }
  .banner.good { background: var(--good-bg); }
  .banner.warn { background: var(--warn-bg); }
  .banner.bad { background: var(--bad-bg); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .linkish { background: none; border: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
  .linkish:hover { background: none; text-decoration: underline; }
  .own-row { display: flex; gap: 8px; font-size: 14px; padding: 4px 0; line-height: 1.4; }
  .own-row .tag { min-width: 28px; flex: none; align-self: flex-start; }
</style>
</head>
<body>
<header>
  <h1 id="hTitle">FRQ Self-Grade</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <span id="sync"></span>
  <button id="signOut" style="display:none">Sign out</button>
</header>

<div id="signin">
  <div class="card">
    <h2 id="siTitle">Grade the FRQ</h2>
    <p>First you'll practice on a few exams from another class and see how your scoring compares with Mr. C's. Then you'll grade your own answers.</p>
    <div id="step1">
      <label class="f" for="classCode">Class code</label>
      <input id="classCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="XXXXXX">
      <div class="row"><button class="primary" id="go1">Next</button></div>
    </div>
    <div id="step2">
      <label class="f" for="stuNum">Your student number</label>
      <input id="stuNum" inputmode="numeric" autocomplete="off" placeholder="e.g. 23">
      <label class="f" for="stuName">Your name</label>
      <select id="stuName"><option value="">Choose your name…</option></select>
      <div class="row"><button id="back1">Back</button><button class="primary" id="go2">Start</button></div>
    </div>
    <div class="msg" id="siMsg"></div>
  </div>
</div>

<div id="app">
  <div id="steps"></div>
  <div id="layout">
    <div id="paperPane">
      <div class="tools"><button data-z="1">Fit</button><button data-z="1.5">150%</button><button data-z="2.2">220%</button><span id="paperLabel"></span></div>
      <div id="pages"></div>
    </div>
    <div id="main"></div>
  </div>
</div>

<script>
"use strict";
const TEST = (new URLSearchParams(location.search).get("test") || "unit3").replace(/[^a-z0-9_-]/gi, "");
const OFF_BY = 3;   // a total that differs from Mr. C's by this much or more is "off"
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ab64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const store = {
  get(k, s = localStorage) { try { return JSON.parse(s.getItem(k)); } catch { return null; } },
  set(k, v, s = localStorage) { try { s.setItem(k, JSON.stringify(v)); } catch {} },
  del(k, s = localStorage) { try { s.removeItem(k); } catch {} },
};

let DATA = null, CLASS = null, ME = null, ST = null, VIEW = null, zoom = 1;
const pageUrls = new Map();

// ---------- crypto: same as make_calibration.mjs ----------
async function pbkdf(str, salt, bits) {
  const base = await crypto.subtle.importKey("raw", enc.encode(str), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: DATA.kdf.iterations }, base, bits));
}
async function unseal(str, table) {
  const bits = await pbkdf(str, ub64(DATA.kdf.salt), 384);
  const rec = table[ab64(bits.slice(0, 16))];
  if (!rec) return null;
  const key = await crypto.subtle.importKey("raw", bits.slice(16), "AES-GCM", false, ["decrypt"]);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(rec.iv) }, key, ub64(rec.ct))));
}
async function pageUrl(p) {
  if (pageUrls.has(p.f)) return pageUrls.get(p.f);
  const r = await fetch(`self-grade/${TEST}/${p.f}`);
  if (!r.ok) throw new Error("page " + r.status);
  const key = await crypto.subtle.importKey("raw", ub64(p.k), "AES-GCM", false, ["decrypt"]);
  const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(p.iv) }, key, await r.arrayBuffer());
  const u = URL.createObjectURL(new Blob([raw], { type: "image/jpeg" }));
  pageUrls.set(p.f, u);
  return u;
}
const normCode = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");

// ---------- sign in: class code, then student number + name ----------
async function loadData() {
  if (DATA) return DATA;
  const r = await fetch(`self-grade/${TEST}.json`, { cache: "no-cache" });
  if (!r.ok) throw new Error("This test isn't set up yet.");
  DATA = await r.json();
  $("#hTitle").textContent = DATA.title + " · Self-Grade";
  $("#siTitle").textContent = "Grade the " + DATA.title;
  document.title = DATA.title + " Self-Grade";
  return DATA;
}
async function step1() {
  const code = normCode($("#classCode").value);
  $("#siMsg").textContent = "";
  if (code.length < 4) { $("#siMsg").textContent = "Type the class code from the board."; return; }
  $("#go1").disabled = true; $("#go1").textContent = "Checking…";
  try {
    await loadData();
    const c = await unseal("C" + code, DATA.classes);
    if (!c) { $("#siMsg").textContent = "That class code didn't work. Check it and try again."; return; }
    CLASS = { ...c, code };
    $("#stuName").innerHTML = '<option value="">Choose your name…</option>' + c.roster.map(n => `<option>${esc(n)}</option>`).join("");
    $("#step1").style.display = "none"; $("#step2").style.display = "block";
    $("#stuNum").focus();
  } catch (e) { $("#siMsg").textContent = e.message || "Something went wrong."; }
  finally { $("#go1").disabled = false; $("#go1").textContent = "Next"; }
}
async function step2() {
  const num = $("#stuNum").value.trim().replace(/^#/, ""), name = $("#stuName").value;
  $("#siMsg").textContent = "";
  if (!/^\d+$/.test(num)) { $("#siMsg").textContent = "Type your student number (just the number)."; return; }
  if (!name) { $("#siMsg").textContent = "Choose your name."; return; }
  $("#go2").disabled = true; $("#go2").textContent = "Opening…";
  try {
    const me = await unseal("S" + CLASS.code + "|" + num, DATA.records);
    if (!me || me.name !== name) { $("#siMsg").textContent = "That number and name don't match. Check both, or ask Mr. C."; return; }
    ME = me;
    store.set("fsg-signin-" + TEST, { code: CLASS.code, num }, sessionStorage);
    await startApp();
  } catch (e) { $("#siMsg").textContent = e.message || "Something went wrong."; }
  finally { $("#go2").disabled = false; $("#go2").textContent = "Start"; }
}

// ---------- progress ----------
// ST = { Q1: { cal: { A: {pts:[ids], ts} }, unlocked: ts|null, own: {pts, note, ts}|null }, Q2: … }
const stKey = () => `fsg2|${TEST}|${ME.period}|${ME.number}`;
function loadState() {
  const s = store.get(stKey()) || {};
  for (const q of DATA.questions) s[q.id] ||= { cal: {}, unlocked: null, own: null };
  return s;
}
const saveState = () => store.set(stKey(), ST);

const qById = id => DATA.questions.find(q => q.id === id);
const allPts = q => q.parts.flatMap(p => p.points.map(x => x.id));
const exam = label => CLASS.calib.find(e => e.label === label);
const mrcTotal = (qid, label) => Object.values(exam(label)[qid].pts).reduce((a, b) => a + b, 0);
const diffOf = (qid, label) => Math.abs(ST[qid].cal[label].pts.length - mrcTotal(qid, label));

// Steps for one question: Exams A, B, C; D and E only if C was 3+ off; "See Mr. C" if E was still 3+ off; then their own.
function stepsFor(qid) {
  const s = ST[qid], out = [];
  for (const l of ["A", "B", "C"]) out.push({ q: qid, kind: "cal", label: l });
  const extra = !!s.cal.C && diffOf(qid, "C") >= OFF_BY;
  if (extra) for (const l of ["D", "E"]) out.push({ q: qid, kind: "cal", label: l });
  if (extra && s.cal.E && diffOf(qid, "E") >= OFF_BY) out.push({ q: qid, kind: "gate" });
  out.push({ q: qid, kind: "own" });
  return { out, maybeExtra: !s.cal.C };
}
function isDone(st) {
  const s = ST[st.q];
  if (st.kind === "cal") return !!s.cal[st.label];
  if (st.kind === "gate") return !!s.unlocked;
  return !!s.own;
}
const allSteps = () => DATA.questions.flatMap(q => stepsFor(q.id).out);
const currentStep = () => allSteps().find(st => !isDone(st)) || null;
const sameStep = (a, b) => !!a && !!b && a.q === b.q && a.kind === b.kind && a.label === b.label;

// ---------- results go to Mr. C's Google Sheet (queued on this device until they're accepted) ----------
const qKey = () => `fsg2q|${TEST}|${ME.period}|${ME.number}`;
const queue = () => store.get(qKey()) || [];
function report(ev) {
  store.set(qKey(), [...queue(), { test: TEST, period: ME.period, number: ME.number, name: ME.name, token: ME.token, ...ev, ts: new Date().toISOString(), id: crypto.randomUUID() }]);
  flush();
}
let flushing = false, retry = null;
async function flush() {
  if (!DATA.sheet || flushing) { syncLabel(); return; }
  flushing = true; clearTimeout(retry);
  try {
    for (let q = queue(); q.length; q = queue()) {
      const r = await fetch(DATA.sheet, { method: "POST", body: JSON.stringify(q[0]) });   // text/plain: no CORS preflight
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "not saved");
      store.set(qKey(), queue().filter(x => x.id !== q[0].id));
    }
  } catch { retry = setTimeout(flush, 15000); }
  finally { flushing = false; syncLabel(); }
}
function syncLabel() {
  if (!ME) return;
  const n = queue().length, el = $("#sync");
  el.className = n ? "bad" : "";
  el.textContent = !DATA.sheet ? (n ? "Saved on this device" : "") : n ? `Sending ${n} result${n > 1 ? "s" : ""} to Mr. C…` : "All results sent";
}
// What this student already turned in, from any device, so starting over somewhere else doesn't reset anything.
async function pullProgress() {
  if (!DATA.sheet) return;
  try {
    const p = new URLSearchParams({ action: "progress", test: TEST, period: ME.period, number: ME.number, token: ME.token });
    const j = await (await fetch(`${DATA.sheet}?${p}`)).json();
    if (!j.ok) return;
    for (const ev of j.events || []) {
      const s = ST[ev.question]; if (!s) continue;
      const pts = String(ev.points || "").split(/\s+/).filter(Boolean);
      if (ev.kind === "cal" && !s.cal[ev.label]) s.cal[ev.label] = { pts, ts: ev.ts };
      if (ev.kind === "own" && !s.own) s.own = { pts, note: ev.note || "", ts: ev.ts };
      if (ev.kind === "unlock" && !s.unlocked) s.unlocked = ev.ts;
    }
    saveState();
  } catch {}
}

// ---------- app ----------
async function startApp() {
  ST = loadState();
  $("#signin").style.display = "none"; $("#app").style.display = "block";
  $("#who").textContent = `${ME.name} · ${ME.period} · #${ME.number}`;
  $("#signOut").style.display = "";
  $("#main").innerHTML = '<div class="intro">Loading your progress…</div>';
  await pullProgress();
  VIEW = null;
  render();
  flush();
}
function signOut() { store.del("fsg-signin-" + TEST, sessionStorage); location.reload(); }

function stepLabel(st) { return st.kind === "cal" ? "Exam " + st.label : st.kind === "gate" ? "See Mr. C" : "Your " + st.q; }
function renderSteps(cur, view) {
  const chips = [];
  for (const q of DATA.questions) {
    const { out, maybeExtra } = stepsFor(q.id);
    chips.push(`<span class="grp">${esc(q.id)}</span>`);
    for (const st of out) {
      const done = isDone(st);
      let cls = "chip";
      if (done) cls += st.kind === "cal" && diffOf(st.q, st.label) >= OFF_BY ? " off" : " done";
      else if (sameStep(st, cur)) cls += " now";
      else cls += " later";
      if (sameStep(st, view)) cls += " viewing";
      chips.push(`<span class="${cls}" data-step="${esc(JSON.stringify(st))}">${esc(stepLabel(st))}${done ? " ✓" : ""}</span>`);
      if (st.kind === "cal" && st.label === "C" && maybeExtra) chips.push(`<span class="chip later" title="Only if your Exam C total is ${OFF_BY}+ points from Mr. C's">D, E if needed</span>`);
    }
  }
  $("#steps").innerHTML = chips.join("");
  $("#steps").querySelectorAll(".chip.done, .chip.off, .chip.now").forEach(el => el.onclick = () => { VIEW = JSON.parse(el.dataset.step); render(); });
}

async function showPaper(pages, label) {
  document.body.classList.add("with-paper");
  $("#paperLabel").textContent = label;
  const box = $("#pages");
  const n = (showPaper.n = (showPaper.n || 0) + 1);
  box.innerHTML = '<div class="loading">Loading the pages…</div>';
  try {
    const urls = await Promise.all(pages.map(pageUrl));
    if (n !== showPaper.n) return;
    box.innerHTML = urls.map((u, i) => `<img src="${u}" alt="${esc(label)}, page ${i + 1}">`).join("");
    applyZoom();
    $("#paperPane").scrollTop = 0;
  } catch { if (n === showPaper.n) box.innerHTML = "<div class=\"loading\">The pages didn't load. Check your connection and reload.</div>"; }
}
function hidePaper() { showPaper.n = (showPaper.n || 0) + 1; document.body.classList.remove("with-paper"); $("#pages").innerHTML = ""; }
function applyZoom() { $("#pages").querySelectorAll("img").forEach(i => i.style.width = (zoom * 100) + "%"); }

function render() {
  const cur = currentStep();
  const view = VIEW && !sameStep(VIEW, cur) ? VIEW : cur;
  renderSteps(cur, view);
  window.scrollTo(0, 0);
  if (!view) return renderFinished();
  const q = qById(view.q);
  if (view.kind === "gate") return renderGate(q);
  if (!isDone(view)) return renderGrade(q, view);
  return view.kind === "cal" ? renderCompare(q, view.label, cur) : renderOwnDone(q, cur);
}
function nextButton(cur) {
  if (!cur) return `<button class="primary" id="next">Finish →</button>`;
  const t = cur.kind === "cal" ? `Next: ${cur.q} Exam ${cur.label}` : cur.kind === "gate" ? "Next" : `Next: grade your own ${cur.q}`;
  return `<button class="primary" id="next">${esc(t)} →</button>`;
}
function wireNext() { const n = $("#next"); if (n) n.onclick = () => { VIEW = null; render(); }; }

function renderGrade(q, st) {
  const isCal = st.kind === "cal";
  const title = isCal ? `${q.id} · Exam ${st.label}` : `${q.id} · Your own answer`;
  showPaper(isCal ? exam(st.label)[q.id].pages : ME.own[q.id], title);
  const draftKey = `fsg2d|${TEST}|${ME.period}|${ME.number}|${q.id}|${isCal ? st.label : "own"}`;
  const picked = new Set(store.get(draftKey, sessionStorage) || []);
  const intro = isCal
    ? "This answer is from a student in another class. Check every point the work earns, using the criteria below. After you lock in, you'll see how your scoring compares with Mr. C's."
    : "Grade your own answer the same way you graded the practice exams: check only the points your work actually shows. Mr. C will compare your scores with his.";
  $("#main").innerHTML = `
    <h2 class="title">${esc(title)}</h2>
    <div class="intro">${intro}</div>
    <div class="box">${q.parts.map(p => `<div class="part"><h3>Part ${esc(p.label)}</h3>${p.points.map(x =>
      `<div class="pt${picked.has(x.id) ? " on" : ""}" data-id="${esc(x.id)}" role="checkbox" aria-checked="${picked.has(x.id)}" tabindex="0"><div class="cb">✓</div><div class="txt"><span class="pid">${esc(x.id)}</span>${esc(x.criterion)}</div></div>`).join("")}</div>`).join("")}
      <div class="total"><span>Points checked</span><b id="tot">${picked.size} / ${q.total}</b></div>
    </div>
    ${isCal ? "" : `<div class="box" style="padding:12px 14px"><label class="f" style="margin-top:0" for="note">Anything you want Mr. C to know? (optional)</label><textarea id="note" maxlength="500"></textarea></div>`}
    <div class="actions"><button class="primary" id="lock">Lock in ${esc(isCal ? "Exam " + st.label : "my score")}</button></div>
    <div class="intro" style="margin-top:8px">You can't change your scores after you lock in.</div>`;
  const toggle = el => {
    const id = el.dataset.id;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    el.classList.toggle("on", picked.has(id)); el.setAttribute("aria-checked", picked.has(id));
    $("#tot").textContent = `${picked.size} / ${q.total}`;
    store.set(draftKey, [...picked], sessionStorage);
  };
  $("#main").querySelectorAll(".pt").forEach(el => {
    el.onclick = () => toggle(el);
    el.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(el); } };
  });
  $("#lock").onclick = () => {
    const ids = allPts(q), pts = ids.filter(id => picked.has(id));
    if (!confirm(`Lock in ${pts.length}/${q.total} for ${isCal ? "Exam " + st.label : "your own " + q.id}? You can't change it after this.`)) return;
    const ts = new Date().toISOString();
    if (isCal) {
      ST[q.id].cal[st.label] = { pts, ts };
      const mrc = exam(st.label)[q.id].pts;
      report({ kind: "cal", question: q.id, label: st.label, points: pts.join(" "), total: pts.length, outOf: q.total,
        mrcPoints: ids.filter(id => mrc[id]).join(" "), mrcTotal: mrcTotal(q.id, st.label),
        matched: ids.filter(id => picked.has(id) === !!mrc[id]).length });
    } else {
      const note = ($("#note").value || "").trim();
      ST[q.id].own = { pts, note, ts };
      report({ kind: "own", question: q.id, label: "Own", points: pts.join(" "), total: pts.length, outOf: q.total, note });
    }
    store.del(draftKey, sessionStorage);
    saveState();
    VIEW = { ...st };
    render();
  };
}

function renderCompare(q, label, cur) {
  const ex = exam(label)[q.id], mine = new Set(ST[q.id].cal[label].pts);
  showPaper(ex.pages, `${q.id} · Exam ${label}`);
  const ids = allPts(q), my = mine.size, mrc = mrcTotal(q.id, label);
  const matched = ids.filter(id => mine.has(id) === !!ex.pts[id]).length;
  const d = my - mrc, off = Math.abs(d) >= OFF_BY;
  const howFar = `${Math.abs(d)} point${Math.abs(d) === 1 ? "" : "s"} ${d > 0 ? "higher" : "lower"} than Mr. C's`;
  const tag = v => `<span class="tag ${v ? "y" : "n"}">${v ? "✓" : "✗"}</span>`;
  const rows = q.parts.map(p => `<div class="part" style="padding:6px 4px"><h3 style="padding:0 8px">Part ${esc(p.label)}</h3>${p.points.map(x => {
    const a = mine.has(x.id), b = !!ex.pts[x.id];
    return `<details class="${a !== b ? "miss" : ""}"${a !== b ? " open" : ""}><summary><span><span class="pid">${esc(x.id)}</span>${esc(x.criterion)}</span>${tag(a)}${tag(b)}<span class="arrow">▶</span></summary><div class="why"><b>Why:</b> ${esc(ex.why[x.id] || "")}</div></details>`;
  }).join("")}</div>`).join("");
  let banner;
  if (label === "C" && off) banner = `<div class="banner warn">Your total was ${howFar}. Read the reasons for the points you scored differently. Next you'll grade two more practice exams, D and E.</div>`;
  else if (label === "E" && off) banner = `<div class="banner bad">Your total is still ${howFar}. <b>Talk to Mr. C before you grade your own ${esc(q.id)}.</b> He'll go over the practice exams with you.</div>`;
  else if (off) banner = `<div class="banner warn">Your total was ${howFar}. Open the points marked in yellow to see why.</div>`;
  else if (matched === ids.length) banner = `<div class="banner good">You matched Mr. C on every point.</div>`;
  else banner = `<div class="banner good">Your total was within ${OFF_BY - 1} points of Mr. C's. The points in yellow are where you scored differently.</div>`;
  $("#main").innerHTML = `
    <h2 class="title">${esc(q.id)} · Exam ${esc(label)}: you vs. Mr. C</h2>
    <div class="intro">Click any point to see the reason for Mr. C's score. Points you scored differently are open and marked in yellow.</div>
    <div class="sumrow">
      <div class="stat"><div class="k">You</div><div class="v">${my}/${q.total}</div></div>
      <div class="stat"><div class="k">Mr. C</div><div class="v">${mrc}/${q.total}</div></div>
      <div class="stat"><div class="k">Points matched</div><div class="v">${matched}/${ids.length}</div></div>
    </div>
    ${banner}
    <div class="box cmp"><div class="head"><span></span><span>You</span><span>Mr. C</span><span></span></div>${rows}</div>
    <div class="actions">${nextButton(cur)}</div>`;
  wireNext();
}

function renderGate(q) {
  hidePaper();
  const labels = Object.keys(ST[q.id].cal).sort();
  $("#main").innerHTML = `
    <h2 class="title">${esc(q.id)}: talk to Mr. C</h2>
    <div class="banner bad">After Exam E, your total was still ${OFF_BY}+ points from Mr. C's. Before you grade your own ${esc(q.id)}, show Mr. C this screen so you can go over how you graded.</div>
    <div class="box" style="padding:12px 14px">
      <div style="font-size:14px;margin-bottom:6px"><b>Your practice results</b></div>
      ${labels.map(l => { const my = ST[q.id].cal[l].pts.length, m = mrcTotal(q.id, l), dd = my - m;
        return `<div style="display:flex;gap:12px;align-items:center;font-size:14px;padding:3px 0"><span style="width:62px">Exam ${l}</span><span>You ${my} · Mr. C ${m}</span><span style="color:${Math.abs(dd) >= OFF_BY ? "var(--warn)" : "var(--good)"}">(${dd >= 0 ? "+" : ""}${dd})</span><button class="linkish" data-l="${l}">Review</button></div>`; }).join("")}
    </div>
    <div class="box" style="padding:12px 14px">
      <label class="f" style="margin-top:0" for="unlockInput">Mr. C: type the unlock code</label>
      <input id="unlockInput" autocomplete="off" maxlength="8">
      <div class="row"><button class="primary" id="unlockBtn">Unlock</button></div>
      <div class="msg" id="unlockMsg"></div>
    </div>`;
  $("#main").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { VIEW = { q: q.id, kind: "cal", label: b.dataset.l }; render(); });
  const tryUnlock = async () => {
    const c = normCode($("#unlockInput").value);
    if (!c) return;
    $("#unlockBtn").disabled = true;
    const h = ab64(await pbkdf(c, ub64(CLASS.unlock.salt), 256));
    $("#unlockBtn").disabled = false;
    if (h !== CLASS.unlock.hash) { $("#unlockMsg").textContent = "That's not the unlock code."; return; }
    ST[q.id].unlocked = new Date().toISOString();
    saveState();
    report({ kind: "unlock", question: q.id, label: "Unlocked" });
    VIEW = null; render();
  };
  $("#unlockBtn").onclick = tryUnlock;
  $("#unlockInput").onkeydown = e => { if (e.key === "Enter") tryUnlock(); };
}

function renderOwnDone(q, cur) {
  const o = ST[q.id].own, mine = new Set(o.pts);
  showPaper(ME.own[q.id], `${q.id} · Your own answer`);
  $("#main").innerHTML = `
    <h2 class="title">${esc(q.id)} · Your own answer</h2>
    <div class="banner good">Locked in: you gave yourself <b>${o.pts.length}/${q.total}</b>. Mr. C will compare this with his scoring.</div>
    <div class="box">${q.parts.map(p => `<div class="part"><h3>Part ${esc(p.label)}</h3>${p.points.map(x =>
      `<div class="own-row"><span class="tag ${mine.has(x.id) ? "y" : "n"}">${mine.has(x.id) ? "✓" : "✗"}</span><span><span class="pid">${esc(x.id)}</span>${esc(x.criterion)}</span></div>`).join("")}</div>`).join("")}</div>
    ${o.note ? `<div class="intro"><b>Your note:</b> ${esc(o.note)}</div>` : ""}
    <div class="actions">${nextButton(cur)}</div>`;
  wireNext();
}

function renderFinished() {
  hidePaper();
  const waiting = DATA.sheet && queue().length;
  $("#main").innerHTML = `
    <h2 class="title">All done</h2>
    <div class="banner good">You've finished the practice grading and graded your own ${DATA.questions.map(q => esc(q.id)).join(" and ")}. ${waiting ? "Keep this page open until it says “All results sent” at the top." : "Your results have gone to Mr. C."}</div>
    <div class="intro">Your self-scores: ${DATA.questions.map(q => `${esc(q.id)} ${ST[q.id].own.pts.length}/${q.total}`).join(" · ")}. Click any step above to look back at it.</div>`;
}

// ---------- wiring ----------
$("#go1").onclick = step1;
$("#classCode").onkeydown = e => { if (e.key === "Enter") step1(); };
$("#go2").onclick = step2;
$("#back1").onclick = () => { $("#step2").style.display = "none"; $("#step1").style.display = "block"; $("#siMsg").textContent = ""; };
$("#signOut").onclick = signOut;
document.querySelectorAll("#paperPane [data-z]").forEach(b => b.onclick = () => { zoom = +b.dataset.z; applyZoom(); });
window.addEventListener("online", flush);
(async () => {
  try { await loadData(); } catch (e) { $("#siMsg").textContent = e.message; return; }
  const saved = store.get("fsg-signin-" + TEST, sessionStorage);   // a reload in the same tab skips the sign-in
  if (saved) {
    try {
      const c = await unseal("C" + saved.code, DATA.classes);
      const me = c && await unseal("S" + saved.code + "|" + saved.num, DATA.records);
      if (c && me) { CLASS = { ...c, code: saved.code }; ME = me; await startApp(); return; }
    } catch {}
  }
  $("#classCode").focus();
})();
</script>
</body>
</html>
