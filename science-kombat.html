<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<title>Science Brawl</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
    background: #05050a; color: #fff;
    font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #16162a 0%, #05050a 70%);
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
  }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; z-index: 1;
  }

  /* ---- Touch controls ---- */
  #controls { position: absolute; inset: 0; z-index: 3; pointer-events: none; display: none; }
  .pad { position: absolute; pointer-events: auto; }
  .btn {
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-weight: 800; color: #fff;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    font-size: 3.4vh; text-shadow: 0 1px 2px #000; line-height: 1;
    transition: transform .05s, background .05s;
  }
  .btn small { font-size: 1.5vh; font-weight: 700; opacity: .8; }
  .btn.press { transform: scale(0.9); background: rgba(255,255,255,0.28); }
  /* left cluster: move + jump */
  /* floating joystick — whole lower-left is the touch zone */
  #joyzone { position:absolute; left:0; bottom:0; width:46%; height:80%; pointer-events:auto; }
  #joybase {
    position:absolute; width:26vh; height:26vh; border-radius:50%;
    left:3vh; bottom:3vh; opacity:0; transition:opacity .12s;
    border:2px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.06);
  }
  #joybase.on { opacity:1; }
  #joythumb {
    position:absolute; left:50%; top:50%; width:11vh; height:11vh; margin:-5.5vh 0 0 -5.5vh;
    border-radius:50%; background:rgba(255,255,255,0.22); border:2px solid rgba(255,255,255,0.5);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #joyjump {
    position:absolute; left:50%; top:8%; transform:translateX(-50%);
    font-size:1.5vh; font-weight:800; color:#cfe0ff; text-shadow:0 1px 2px #000; letter-spacing:.5px;
  }
  #padhint {
    position:absolute; left:50%; bottom:1.5vh; transform:translateX(-50%);
    font-size:1.6vh; font-weight:700; color:#9be07a; background:rgba(0,0,0,.4);
    padding:.5vh 1.6vh; border-radius:999px; display:none;
  }
  #controls.gamepad #joyzone, #controls.gamepad #abtns { opacity:.25; }
  #controls.gamepad #padhint { display:block; }
  /* right cluster: attacks */
  #abtns { right: 2.5vh; bottom: 2.5vh; width: 34vh; height: 24vh; }
  #b-punch  { position:absolute; right: 12vh; bottom: 0;     width: 11.5vh; height: 11.5vh; background: rgba(90,170,255,0.20); border-color: rgba(120,190,255,.6);}
  #b-kick   { position:absolute; right: 0;    bottom: 3vh;   width: 11.5vh; height: 11.5vh; background: rgba(255,150,80,0.20); border-color: rgba(255,180,110,.6);}
  #b-block  { position:absolute; right: 6vh;  bottom: 12.5vh; width: 10vh; height: 10vh; background: rgba(160,160,180,0.18);}
  #b-special{ position:absolute; right: 17vh; bottom: 10vh; width: 12.5vh; height: 12.5vh;
              background: rgba(180,90,255,0.28); border-color: rgba(210,140,255,.75);
              box-shadow: 0 0 14px rgba(180,90,255,.45); }

  /* ---- Overlay screens ---- */
  #screens {
    position: absolute; inset: 0; z-index: 5; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 3vh; overflow-y: auto;
  }
  #screens.hidden { display: none; }
  .title {
    font-size: 8.5vh; font-weight: 900; letter-spacing: 1px; margin: 0;
    background: linear-gradient(180deg,#8fe3ff 0%, #4a9cff 45%, #b06bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 22px rgba(120,140,255,.35); line-height: .95;
  }
  .sub { color: #b9b9d6; font-size: 2.2vh; margin: 1vh 0 3vh; max-width: 90vw; }
  .big-btn {
    font-size: 3vh; font-weight: 800; color: #fff; cursor: pointer;
    padding: 1.6vh 4vh; border-radius: 999px; border: 2px solid rgba(255,255,255,.4);
    background: linear-gradient(180deg,#4a9cff,#2f6fd6); box-shadow: 0 6px 20px rgba(40,90,200,.5);
    margin: 1vh;
  }
  .big-btn:active { transform: scale(.96); }
  .ghost-btn {
    font-size: 2vh; font-weight: 700; color: #cfe0ff; cursor: pointer;
    padding: 1vh 2.6vh; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06); margin: .6vh;
  }
  .roster { display: flex; flex-wrap: wrap; gap: 1.4vh; justify-content: center; max-width: 96vw; margin-bottom: 2vh; }
  .fighter-card {
    width: 20vh; max-width: 130px; border-radius: 12px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
    padding: 1vh; transition: transform .1s, border-color .1s, background .1s;
  }
  .fighter-card.sel { border-color: #ffd34a; background: rgba(255,211,74,.14); transform: translateY(-3px); }
  .fighter-card.locked { cursor: not-allowed; opacity: .9; }
  .fighter-card.locked .fc-name { color: #7a7a90; letter-spacing: 2px; }
  .fighter-card .lock { color: #c48bff; font-weight: 800; }
  .fighter-card.shake { animation: shk .35s; }
  @keyframes shk { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .unlock-banner {
    font-size: 2.2vh; font-weight: 800; color: #0a0a12; line-height: 1.35;
    background: linear-gradient(180deg,#ffe36b,#ffb44a); border-radius: 12px;
    padding: 1.4vh 2.6vh; margin: 0 0 2vh; box-shadow: 0 0 22px rgba(255,200,80,.5);
    animation: pop .4s;
  }
  .unlock-banner b { font-size: 2.6vh; }
  @keyframes pop { 0%{transform:scale(.7);opacity:0} 100%{transform:scale(1);opacity:1} }
  #gameTitle { cursor: pointer; }
  .fighter-card canvas { position: static; width: 100%; height: 13vh; image-rendering: pixelated; background: linear-gradient(180deg,#20203a,#12121f); border-radius: 8px; }
  .fc-name { font-size: 1.9vh; font-weight: 800; margin-top: .5vh; }
  .fc-move { font-size: 1.35vh; color: #b9c6ff; }
  .selrow { display:flex; gap: 3vh; align-items:center; justify-content:center; margin: 1vh 0 2vh; flex-wrap: wrap;}
  .selslot { font-size: 2vh; color:#cfe0ff; }
  .selslot b { color: #ffd34a; font-size: 2.4vh; }
  .hint { color:#8a8ab0; font-size: 1.6vh; margin-top: 1.5vh; max-width: 92vw; }
  #rotate {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #05050a; color: #cfe0ff; text-align: center; padding: 5vh;
  }
  #rotate .ph { font-size: 12vh; margin-bottom: 2vh; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
  .credit { position:absolute; bottom: 1vh; width:100%; text-align:center; color:#55557a; font-size:1.4vh; z-index:4; pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- On-screen touch controls -->
    <div id="controls">
      <!-- floating joystick zone: touch the left area, slide to move, push up (or up-diagonal) to jump -->
      <div id="joyzone">
        <div id="joybase"><div id="joythumb"></div><div id="joyjump">JUMP ▲</div></div>
      </div>
      <div id="abtns" class="pad">
        <div class="btn" id="b-special">★<small>SCI</small></div>
        <div class="btn" id="b-punch">P<small></small></div>
        <div class="btn" id="b-kick">K<small></small></div>
        <div class="btn" id="b-block">⛊</div>
      </div>
      <div id="padhint">🎮 controller connected</div>
    </div>

    <div class="credit">Original fan game · single-file · runs offline</div>

    <!-- Menu / select / results screens -->
    <div id="screens"></div>

    <div id="rotate"><div class="ph">📱</div><div style="font-size:2.6vh;font-weight:800">Rotate your phone</div><div style="margin-top:1vh">Turn sideways (landscape) to fight.</div></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   SCIENCE BRAWL — an original scientist fighting game
   Single self-contained HTML file. Touch + keyboard controls.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Internal render resolution (16:9). All game logic uses these coords.
const VW = 640, VH = 360;
canvas.width = VW; canvas.height = VH;

const GROUND = 300;        // y of the floor line
const GRAV = 0.62;
const FLOOR_W = VW;

/* ---------------- Fighter roster ----------------
   Each scientist drawn from primitive blocks (original art).
   head: style flag drives distinctive hair/features. */
const FIGHTERS = [
  { id:'einstein', name:'A. EINSTEIN', tagline:'Relativity',
    skin:'#e8b98c', hair:'#e9e9ef', coat:'#7d7d86', pants:'#4a4a52', accent:'#8fd6ff',
    head:'einstein',
    special:{ name:'RELATIVITY WAVE', color:'#8fd6ff', kind:'wave', dmg:14, speed:5.2, label:'E=mc²' } },

  { id:'tesla', name:'N. TESLA', tagline:'Electricity',
    skin:'#e6c9a0', hair:'#241d1a', coat:'#26262e', pants:'#141419', accent:'#b98bff',
    head:'tesla',
    special:{ name:'ARC LIGHTNING', color:'#c9b3ff', kind:'bolt', dmg:15, speed:7.5, label:'⚡' } },

  { id:'curie', name:'M. CURIE', tagline:'Radioactivity', female:true,
    skin:'#e7b892', hair:'#2a211c', coat:'#3a3446', pants:'#241f2c', accent:'#8dff9e',
    head:'curie',
    special:{ name:'RADIUM BEAM', color:'#8dff9e', kind:'beam', dmg:13, speed:6.2, label:'Ra' } },

  { id:'newton', name:'I. NEWTON', tagline:'Gravity',
    skin:'#e8bd95', hair:'#c9c4b8', coat:'#5b3b2a', pants:'#3a2519', accent:'#ffd36b',
    head:'newton',
    special:{ name:'GRAVITY APPLE', color:'#ff5a5a', kind:'apple', dmg:16, speed:4.6, label:'g' } },

  { id:'darwin', name:'C. DARWIN', tagline:'Evolution',
    skin:'#e4b189', hair:'#d8d2c4', coat:'#3d4a3a', pants:'#26301f', accent:'#9be07a',
    head:'darwin',
    special:{ name:'NATURAL SELECT', color:'#9be07a', kind:'swarm', dmg:12, speed:5.6, label:'🐛' } },

  { id:'hawking', name:'S. HAWKING', tagline:'Black holes',
    skin:'#e8bd95', hair:'#8a8a92', coat:'#2b2f3a', pants:'#20242c', accent:'#c48bff',
    head:'hawking',
    special:{ name:'EVENT HORIZON', color:'#b487ff', kind:'hole', dmg:15, speed:4.4, label:'∞' } },

  // ---- secret / unlockable roster (unlocked by winning matches) ----
  { id:'ada', name:'A. LOVELACE', tagline:'Computing', female:true, secret:true,
    skin:'#e9bd98', hair:'#3a2a22', coat:'#3b2d55', pants:'#2a2038', accent:'#ffd36b',
    head:'ada',
    special:{ name:'PUNCH-CARD LOOP', color:'#ffd36b', kind:'cards', dmg:13, speed:5.4, label:'01' } },

  { id:'franklin', name:'R. FRANKLIN', tagline:'DNA / X-ray', female:true, secret:true,
    skin:'#e7b892', hair:'#2b211d', coat:'#c9ccd6', pants:'#3a3a44', accent:'#ff5ea8',
    head:'franklin',
    special:{ name:'DOUBLE HELIX', color:'#ff5ea8', kind:'helix', dmg:14, speed:5.6, label:'DNA' } },

  { id:'johnson', name:'K. JOHNSON', tagline:'Orbital math', female:true, secret:true,
    skin:'#8a5a3c', hair:'#241a16', coat:'#3f5a7a', pants:'#26313f', accent:'#eaf2ff',
    head:'johnson',
    special:{ name:'ORBITAL SLINGSHOT', color:'#8fd6ff', kind:'orbit', dmg:14, speed:5.0, label:'∮' } },

  { id:'galileo', name:'GALILEO', tagline:'Astronomy', secret:true,
    skin:'#e3b089', hair:'#b8b2a4', coat:'#6a4a2c', pants:'#3e2a18', accent:'#ffcf6b',
    head:'galileo',
    special:{ name:'COSMIC SPYGLASS', color:'#ffd98a', kind:'star', dmg:15, speed:6.4, label:'★' } },

  { id:'turing', name:'A. TURING', tagline:'Codebreaking', secret:true,
    skin:'#e8bd95', hair:'#4a3a2c', coat:'#42505a', pants:'#2b333a', accent:'#8dff9e',
    head:'turing',
    special:{ name:'ENIGMA CIPHER', color:'#8dff9e', kind:'cipher', dmg:13, speed:6.0, label:'⊕' } },

  { id:'archimedes', name:'ARCHIMEDES', tagline:'Mechanics', secret:true,
    skin:'#d99f74', hair:'#e6e2d6', coat:'#d8d2c0', pants:'#b8b2a0', accent:'#ffcf5a',
    head:'archimedes',
    special:{ name:'BURNING MIRROR', color:'#ffd24a', kind:'deathray', dmg:16, speed:7.2, label:'☀' } },
];

/* ---------------- Unlock system (persisted in localStorage) ---------------- */
const SECRET_ORDER = ['ada','franklin','johnson','galileo','turing','archimedes'];
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function careerWins(){ return parseInt(lsGet('sb_wins','0'),10)||0; }
function cheatOn(){ return lsGet('sb_cheat','0')==='1'; }
function secretsUnlockedCount(){ return cheatOn()?SECRET_ORDER.length:Math.min(SECRET_ORDER.length, careerWins()); }
function isUnlocked(f){ if(!f.secret) return true; return SECRET_ORDER.indexOf(f.id) < secretsUnlockedCount(); }
function recordWinAndCheckUnlock(){
  const before = careerWins();
  lsSet('sb_wins', before+1);
  if(!cheatOn() && before < SECRET_ORDER.length){
    return FIGHTERS.find(f=>f.id===SECRET_ORDER[before]) || null;  // newly revealed fighter
  }
  return null;
}

/* ================= SNES-style articulated fighter renderer =================
   Fighters are drawn in a LOCAL space: origin at the feet midpoint, +x points
   in the facing direction, +y points UP. A ctx transform handles the flip, so
   pose math never has to branch on facing. Limbs are two-segment (upper+fore)
   capsules with outline + shading; heads carry per-scientist hair & features. */

function shade(hex, f){                       // multiply an #rrggbb toward dark/light
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.min(255,r*f))|0; g=Math.max(0,Math.min(255,g*f))|0; b=Math.max(0,Math.min(255,b*f))|0;
  return 'rgb('+r+','+g+','+b+')';
}
// palette cache per fighter
function pal(S){
  if(S._pal) return S._pal;
  S._pal = {
    skin:S.skin, skinD:shade(S.skin,0.82), skinL:shade(S.skin,1.12),
    hair:S.hair, hairD:shade(S.hair,0.72), hairL:shade(S.hair,1.18),
    coat:S.coat, coatD:shade(S.coat,0.74), coatL:shade(S.coat,1.16),
    pants:S.pants, pantsD:shade(S.pants,0.74),
    accent:S.accent, shoe:'#1b1b24', shoeD:'#0e0e14',
    ink:'#14121c'
  };
  return S._pal;
}

// two-segment forward kinematics. angle 0 = straight down; +angle swings forward(+x)
function fk(sx,sy,a1,l1,a2,l2){
  const ex=sx+Math.sin(a1)*l1, ey=sy-Math.cos(a1)*l1;
  const a=a1+a2;
  const hx=ex+Math.sin(a)*l2, hy=ey-Math.cos(a)*l2;
  return {ex,ey,hx,hy};
}

function drawFighter(f, dctx){
  const g = dctx || ctx;
  const S = f.data, P = pal(S);
  const t = (typeof gameFrame==='number')?gameFrame:0;

  // ---- pose (all in local space, y-up) ----
  const st = f.state||'idle';
  const grounded = f.onGround!==false;
  const moving = Math.abs(f.vx||0) > 0.3;
  const af = f.attackFrame||0;

  // defaults: relaxed fighting stance
  let lean = 3, headDX = 1.2, headDY = 0, crouch = 0, breathe = Math.sin(t*0.08)*0.4;
  let bArm={a1:0.30,a2:0.55}, fArm={a1:-0.22,a2:0.62};      // back / front arm
  let bLeg={a1:0.20,a2:0.14}, fLeg={a1:-0.20,a2:0.14};      // back / front leg
  let fists=false, blockPose=false, chargeK=0;

  if(st==='walk' || (grounded && moving && st==='idle')){
    const ph=Math.sin(t*0.32);
    bLeg={a1:0.34*ph, a2:0.16+Math.max(0,-ph)*0.3};
    fLeg={a1:-0.34*ph, a2:0.16+Math.max(0,ph)*0.3};
    bArm={a1:-0.42*ph+0.12, a2:0.5};
    fArm={a1:0.42*ph+0.12, a2:0.5};
    lean=4;
  } else if(!grounded){
    crouch=2; lean=6;
    bLeg={a1:0.55,a2:0.7}; fLeg={a1:-0.35,a2:0.7};
    bArm={a1:0.9,a2:0.3}; fArm={a1:-0.85,a2:0.4};
  } else if(st==='attack' && f.attackType==='punch'){
    const A=ATTACKS.punch; const k=Math.min(1,Math.max(0,(af-A.startup+2)/(A.active+2)));
    const ext=k<0.5?k*2:1-(k-0.5)*1.3;                     // thrust out then recoil
    fArm={a1:1.35*(0.25+0.75*ext), a2:0.06}; bArm={a1:-0.55,a2:0.5};
    lean=7; fists=true; headDX=2;
  } else if(st==='attack' && f.attackType==='kick'){
    const A=ATTACKS.kick; const k=Math.min(1,Math.max(0,(af-A.startup+2)/(A.active+2)));
    const ext=k<0.5?k*2:1-(k-0.5)*1.2;
    fLeg={a1:1.4*(0.3+0.7*ext), a2:0.05}; bLeg={a1:0.15,a2:0.1};
    lean=-3; bArm={a1:0.6,a2:0.5}; fArm={a1:-0.7,a2:0.5}; fists=true;
  } else if(st==='special'){
    chargeK=Math.min(1, af/12);
    fArm={a1:1.25,a2:0.12}; bArm={a1:1.05,a2:0.2};
    lean=6; fists=true; headDX=2;
  } else if(st==='hitstun'){
    lean=-9; headDX=-2.5; crouch=1;
    bArm={a1:-0.7,a2:0.4}; fArm={a1:-0.5,a2:0.5};
    bLeg={a1:0.1,a2:0.1}; fLeg={a1:-0.45,a2:0.2};
  }
  if(f.blockHold && st!=='attack' && st!=='special' && st!=='hitstun'){
    fArm={a1:0.12,a2:1.55}; bArm={a1:0.12,a2:1.45};
    blockPose=true; lean=2; fists=true;
  }

  // ---- geometry (local, y-up from feet) ----
  const hipY = 20 - crouch, shoulderY = 37 - crouch, neckY = 39 - crouch;
  const headCy = 46 - crouch + headDY + breathe, headR = 7.4;
  const leanX = lean*0.14;                                  // torso tips toward facing
  const hipX = 0, shoulderX = leanX;

  g.save();
  g.translate(f.x, f.y);
  g.scale(f.facing, 1);

  // capsule limb with outline + directional shading (y-up input; converts to canvas)
  function limb(x1,y1,x2,y2,w,col,dark,light){
    const X1=x1,Y1=-y1,X2=x2,Y2=-y2;
    const ang=Math.atan2(Y2-Y1,X2-X1), len=Math.hypot(X2-X1,Y2-Y1);
    g.save(); g.translate(X1,Y1); g.rotate(ang);
    g.fillStyle=P.ink; g.fillRect(-w/2-1,-w/2-1,len+w+2,w+2);      // outline
    g.fillStyle=col;   g.fillRect(-w/2,-w/2,len+w,w);              // fill
    if(light){ g.fillStyle=light; g.fillRect(-w/2, -w/2, len+w, Math.max(1,w*0.28)); } // top highlight
    if(dark){  g.fillStyle=dark;  g.fillRect(-w/2, w/2-Math.max(1,w*0.3), len+w, Math.max(1,w*0.3)); } // underside
    g.restore();
  }
  function ball(x,y,r,col,dark){ g.fillStyle=P.ink; disc(x,-y,r+1); g.fillStyle=col; disc(x,-y,r);
    if(dark){ g.fillStyle=dark; g.beginPath(); g.arc(x,-y+r*0.35,r*0.7,0,Math.PI*2); g.fill(); } }
  function disc(cx,cy,r){ g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill(); }
  function rectL(x,y,w,h,col){ g.fillStyle=col; g.fillRect(x,-y-h,w,h); }   // y-up rect (y=bottom)

  // ---- shadow-side (back) limbs first ----
  const bl=fk(hipX-1.5, hipY, bLeg.a1, 11, bLeg.a2, 11);
  limb(hipX-1.5,hipY, bl.ex,bl.ey, 6.5, P.pantsD, shade(S.pants,0.6));
  limb(bl.ex,bl.ey, bl.hx,bl.hy, 6, P.pantsD, shade(S.pants,0.6));
  foot(bl.hx,bl.hy, P.shoeD, P.ink);

  const ba=fk(shoulderX-1, shoulderY, bArm.a1, 8.5, bArm.a2, 8, );
  limb(shoulderX-1,shoulderY, ba.ex,ba.ey, 5, P.coatD, shade(S.coat,0.6));
  limb(ba.ex,ba.ey, ba.hx,ba.hy, 4.6, P.coatD, shade(S.coat,0.6));
  ball(ba.hx,ba.hy, 2.6, P.skinD);

  // wheelchair (Hawking) sits between back and front layers
  if(S.head==='hawking') drawChair(g,P);

  // ---- torso / lab coat ----
  torso();

  // ---- head ----
  head();

  // ---- front leg ----
  const fl=fk(hipX+1.5, hipY, fLeg.a1, 11, fLeg.a2, 11);
  limb(hipX+1.5,hipY, fl.ex,fl.ey, 7, P.pants, P.pantsD, shade(S.pants,1.15));
  limb(fl.ex,fl.ey, fl.hx,fl.hy, 6.4, P.pants, P.pantsD, shade(S.pants,1.15));
  foot(fl.hx,fl.hy, P.shoe, P.shoeD);

  // ---- skirt (women) draws over the upper legs ----
  if(S.female) skirt();

  // ---- front arm ----
  const fa=fk(shoulderX+1, shoulderY, fArm.a1, 8.5, fArm.a2, 8);
  limb(shoulderX+1,shoulderY, fa.ex,fa.ey, 5.4, P.coat, P.coatD, P.coatL);
  limb(fa.ex,fa.ey, fa.hx,fa.hy, 5, P.coat, P.coatD, P.coatL);
  if(fists){ ball(fa.hx,fa.hy, 3.1, P.skin, P.skinD); }
  else { ball(fa.hx,fa.hy, 2.9, P.skin, P.skinD); }

  // charging glow at hands during special
  if(chargeK>0){
    g.fillStyle=S.special.color; g.globalAlpha=0.35+0.3*Math.sin(t*0.6);
    disc(fa.hx,-fa.hy, 4+chargeK*4); g.globalAlpha=1;
  }
  if(blockPose){ g.fillStyle='rgba(150,200,255,0.16)'; g.fillRect(-2,-headCy-headR-2, 14, headCy+headR+6); }

  g.restore();

  // hit flash (screen-space, unflipped)
  if(f.hitFlash>0){
    g.save(); g.globalCompositeOperation='lighter';
    g.fillStyle='rgba(255,120,120,'+(0.5*f.hitFlash/8)+')';
    g.fillRect(f.x-13, f.y-56, 26, 58); g.restore();
  }

  // ---------- inner drawers ----------
  function foot(x,y,col,dark){
    g.fillStyle=P.ink; g.fillRect(x-2, -y-1, 9, 5);
    g.fillStyle=col;   g.fillRect(x-1.5, -y-0.5, 8, 3.5);
    g.fillStyle=dark;  g.fillRect(x-1.5, -y+2, 8, 1.4);
  }
  function skirt(){
    const topY=hipY+2, botY=hipY-9, wTop=13, wBot=22;   // y-up: A-line flare
    const p=(a,b)=>{ g.lineTo(shoulderX*0.4 + a, -b); };
    g.fillStyle=P.ink;
    g.beginPath(); g.moveTo(shoulderX*0.4-wTop/2-1,-topY);
    p(wTop/2+1,topY); p(wBot/2+1,botY-0.5); p(-wBot/2-1,botY-0.5); g.closePath(); g.fill();
    g.fillStyle=P.coat;
    g.beginPath(); g.moveTo(shoulderX*0.4-wTop/2,-topY);
    p(wTop/2,topY); p(wBot/2,botY); p(-wBot/2,botY); g.closePath(); g.fill();
    // back-half shade + pleat lines + hem highlight
    g.fillStyle=P.coatD;
    g.beginPath(); g.moveTo(shoulderX*0.4-wTop/2,-topY);
    p(0,topY); p(0,botY); p(-wBot/2,botY); g.closePath(); g.fill();
    g.fillStyle=shade(S.coat,0.85);
    for(let i=-1;i<=1;i++){ g.fillRect(shoulderX*0.4+i*5, -topY+1, 0.8, (topY-botY)); }
    g.fillStyle=P.coatL; g.fillRect(shoulderX*0.4-wBot/2, -botY, wBot, 1.4);
  }
  function torso(){
    const topY=shoulderY+2, botY=hipY-1, h=topY-botY, w=15;
    const x=shoulderX-w/2 + (leanX>0? -1:0);
    // outline + coat body (slight trapezoid via two rects)
    g.fillStyle=P.ink; g.fillRect(x-1, -topY-1, w+2, h+2);
    g.fillStyle=P.coat; g.fillRect(x, -topY, w, h);
    // shaded back half
    g.fillStyle=P.coatD; g.fillRect(x, -topY, w*0.42, h);
    // collar / neckline V
    g.fillStyle='#efece4'; g.beginPath();
    g.moveTo(shoulderX-3.5,-topY); g.lineTo(shoulderX+3.5,-topY);
    g.lineTo(shoulderX, -botY-3); g.closePath(); g.fill();
    if(S.female){
      // blouse neckline + brooch (no necktie)
      g.fillStyle=S.accent; g.fillRect(shoulderX-1.3, -topY+2, 2.6, 2.6);      // brooch
      g.fillStyle=P.coatL; g.fillRect(x, -topY, w, 1.6);                        // collar highlight
    } else {
      // necktie + buttons
      g.fillStyle=S.accent; g.fillRect(shoulderX-1.4, -topY+1, 2.8, h-3);
      g.fillStyle=P.coatD; for(let i=0;i<3;i++) g.fillRect(shoulderX+2.5, -topY+3+i*3.4, 1.3,1.3);
      g.fillStyle=P.coatL; g.fillRect(x, -topY, w, 1.6);
      g.fillStyle='#221c16'; g.fillRect(x, -botY-2, w, 2);                      // belt
    }
  }
  function head(){
    const cx=shoulderX+headDX, cy=headCy, r=headR;
    // neck
    g.fillStyle=P.skinD; g.fillRect(cx-2.4, -neckY-1, 4.8, 4);
    // skull outline + skin
    g.fillStyle=P.ink; disc(cx,-cy,r+1);
    g.fillStyle=P.skin; disc(cx,-cy,r);
    // face shading (back third darker)
    g.fillStyle=P.skinD; g.beginPath(); g.arc(cx,-cy,r,Math.PI*0.55,Math.PI*1.15); g.fill();
    // cheek highlight
    g.fillStyle=P.skinL; g.beginPath(); g.arc(cx+2,-cy-1,r*0.5,0,Math.PI*2); g.fill();
    // ear
    g.fillStyle=P.skinD; disc(cx-r*0.7,-cy, 1.7);
    // nose (forward)
    g.fillStyle=P.skinD; g.fillRect(cx+r-1.5, -cy+0.5, 2.4, 2);
    // brow + eyes
    g.fillStyle=P.ink; g.fillRect(cx+0.5,-cy-2.2, 4.6,1.2);          // brow
    g.fillStyle='#fff'; g.fillRect(cx+1.2,-cy-0.6, 3.6,2.2);         // eye white
    g.fillStyle='#20202a'; g.fillRect(cx+ (st==='hitstun'?2.6:3.0),-cy-0.4, 1.4,1.8); // pupil
    // mouth
    g.fillStyle=P.skinD; g.fillRect(cx+1.6, -cy+3.2, 3.2, 1);
    drawHair(g,S,P,cx,cy,r, st);
  }
}

// per-scientist hair + facial hair + eyewear (local space, y-up; cx,cy head center)
function drawHair(g,S,P,cx,cy,r, st){
  const F=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,-y-h,w,h); };  // y=bottom edge
  const cap=(x,y,rr,c)=>{ g.fillStyle=c; g.beginPath(); g.arc(x,-y,rr,0,Math.PI*2); g.fill(); };
  switch(S.head){
    case 'einstein': { // wild electrified white hair + bushy mustache
      g.fillStyle=P.hair;
      cap(cx-r*0.5, cy+r*0.5, r*0.95, P.hair);
      cap(cx+r*0.4, cy+r*0.6, r*0.8, P.hair);
      for(let i=0;i<9;i++){ const a=Math.PI*(0.15+0.72*i/8); const rr=r+2.5+ (i%2?2.2:0.5);
        g.fillStyle= i%2?P.hairL:P.hair;
        g.beginPath(); g.arc(cx+Math.cos(a)*rr, -(cy+Math.sin(a)*rr), 2.1,0,Math.PI*2); g.fill(); }
      F(cx-r*0.5, cy-r*0.35, r, 1.6, P.hairD);          // brow shadow of hair
      g.fillStyle='#e8e8ee'; g.fillRect(cx+1.4,-cy+4.2, 4.6,1.8);  // mustache
      break; }
    case 'tesla': { // sleek black hair, sharp center part
      cap(cx, cy+r*0.55, r*0.98, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r);
      g.fillStyle=P.hairL; g.fillRect(cx-r*0.2, -cy-r*0.9, 1.3, r*0.9); // part sheen
      g.fillStyle=P.hairD; g.fillRect(cx-r, -cy-1, r*0.7, r);
      g.fillStyle=P.hair; g.fillRect(cx+1.4,-cy+4.4, 4,1); // thin mustache
      break; }
    case 'curie': { // hair swept into a bun
      cap(cx-r*0.2, cy+r*0.5, r*0.98, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r*0.9);
      cap(cx-r*0.95, cy+0.5, 3.1, P.hairD);                // bun at back
      cap(cx-r*0.95, cy+0.5, 2.0, P.hair);
      g.fillStyle=P.hairD; g.fillRect(cx-r, -cy-1, r*0.8, r*0.9);
      break; }
    case 'newton': { // long baroque curls to the shoulders
      cap(cx, cy+r*0.5, r*1.02, P.hair);
      for(let s=-1;s<=1;s+=1){ for(let j=0;j<3;j++){
        cap(cx + s*(r*0.8) , cy - j*3.2 - 1, 2.6 - j*0.2, j%2?P.hairD:P.hair); } }
      g.fillStyle=P.hairD; g.fillRect(cx-r, -cy-1, r*0.7, r);
      break; }
    case 'darwin': { // bald pate + big full beard
      g.fillStyle=P.hair; g.beginPath(); g.arc(cx,-cy,r*0.55, Math.PI, Math.PI*2); g.fill(); // side fringe
      F(cx-r, cy-1.5, r*2, 1.6, P.hair);
      // beard wraps lower face
      g.fillStyle=P.ink; g.beginPath(); g.arc(cx+1,-cy+r*0.5, r*0.98, -0.2, Math.PI+0.2); g.fill();
      g.fillStyle=P.hair; g.beginPath(); g.arc(cx+1,-cy+r*0.5, r*0.9, -0.2, Math.PI+0.2); g.fill();
      g.fillStyle=P.hairD; g.beginPath(); g.arc(cx+1,-cy+r*0.5, r*0.9, Math.PI*0.55, Math.PI+0.2); g.fill();
      break; }
    case 'hawking': { // thin combed hair + rounded glasses
      cap(cx, cy+r*0.6, r*0.92, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r*0.5);
      g.fillStyle=P.hairD; g.fillRect(cx-r, -cy-1, r*0.8, r*0.5);
      // glasses
      g.strokeStyle='#20303a'; g.lineWidth=1;
      g.beginPath(); g.arc(cx+2.4,-cy+0.4,2.1,0,Math.PI*2); g.stroke();
      g.beginPath(); g.moveTo(cx+4.5,-cy+0.4); g.lineTo(cx+5.6,-cy+0.4); g.stroke();
      break; }
    case 'ada': { // Victorian centre-part with side ringlets
      cap(cx-r*0.1, cy+r*0.5, r*0.98, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r*0.8);
      g.fillStyle=P.hairL; g.fillRect(cx-0.6,-cy-r*0.9,1.2,r*0.8);      // centre-part sheen
      cap(cx-r*0.95, cy-1.5, 2.4, P.hairD); cap(cx-r*0.95, cy-4.2, 2.2, P.hair); // ringlets
      cap(cx-r*0.6, cy+r*0.9, 2.0, P.hairD);                            // small updo top
      break; }
    case 'franklin': { // 1950s wavy side-parted bob
      cap(cx, cy+r*0.55, r*1.0, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r-1, -cy-1, r*2+2, r*0.9);
      for(let i=-1;i<=1;i++) cap(cx+i*r*0.7, cy+r*0.3, 2.2, i<0?P.hairD:P.hair); // waves
      g.fillStyle=P.hairD; g.fillRect(cx-r-1,-cy+1, 2.2, r*0.9);        // side volume
      break; }
    case 'johnson': { // short curls + cat-eye glasses
      for(let i=-2;i<=2;i++) cap(cx+i*2.4, cy+r*0.55, 2.3, i%2?P.hairD:P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r*0.5);
      g.strokeStyle='#20303a'; g.lineWidth=1;
      g.beginPath(); g.arc(cx+2.6,-cy+0.4,2.0,0,Math.PI*2); g.stroke();
      g.fillStyle='#20303a'; g.fillRect(cx+4.2,-cy-1.4,1.6,1.2);        // cat-eye flick
      break; }
    case 'galileo': { // skull-cap, long grey hair, full beard
      g.fillStyle=P.hair; g.fillRect(cx-r,-cy+1,r*0.7,r+1); g.fillRect(cx+r*0.4,-cy+1,r*0.7,r+1); // long sides
      g.fillStyle=shade(S.coat,0.7); g.beginPath(); g.arc(cx,-cy-1,r*0.85,Math.PI,Math.PI*2); g.fill(); // cap
      g.fillStyle=P.ink; g.beginPath(); g.arc(cx+1,-cy+r*0.5,r*0.95,-0.1,Math.PI+0.1); g.fill();
      g.fillStyle=P.hair; g.beginPath(); g.arc(cx+1,-cy+r*0.5,r*0.86,-0.1,Math.PI+0.1); g.fill(); // beard
      g.fillStyle=P.hairD; g.beginPath(); g.arc(cx+1,-cy+r*0.5,r*0.86,Math.PI*0.55,Math.PI+0.1); g.fill();
      break; }
    case 'turing': { // neat short side-parted hair
      cap(cx, cy+r*0.6, r*0.95, P.hair);
      g.fillStyle=P.hair; g.fillRect(cx-r, -cy-1, r*2, r*0.55);
      g.fillStyle=P.hairD; g.fillRect(cx-r,-cy-1, r*0.55, r*0.55);
      g.fillStyle=P.hairL; g.fillRect(cx+r*0.1,-cy-r*0.5,1,r*0.5);      // part
      break; }
    case 'archimedes': { // laurel wreath + curly crown + big white beard
      for(let i=-2;i<=2;i++) cap(cx+i*2.3, cy+r*0.55, 2.2, i%2?P.hairD:P.hair); // curls
      g.fillStyle=P.ink; g.beginPath(); g.arc(cx+1,-cy+r*0.55,r*1.0,-0.15,Math.PI+0.15); g.fill();
      g.fillStyle=P.hair; g.beginPath(); g.arc(cx+1,-cy+r*0.55,r*0.9,-0.15,Math.PI+0.15); g.fill();  // beard
      g.fillStyle=P.hairD; g.beginPath(); g.arc(cx+1,-cy+r*0.55,r*0.9,Math.PI*0.55,Math.PI+0.15); g.fill();
      // laurel wreath
      g.fillStyle='#6fae4e';
      for(let i=0;i<5;i++){ const a=Math.PI*(0.15+0.7*i/4); g.beginPath();
        g.ellipse(cx+Math.cos(a)*(r+1), -(cy+Math.sin(a)*(r+1)), 1.8,1,a,0,Math.PI*2); g.fill(); }
      break; }
  }
}

function drawChair(g,P){
  // simple motorized wheelchair in local space (y-up)
  g.fillStyle=P.ink; g.fillRect(-11,-18,22,15);
  g.fillStyle='#31333f'; g.fillRect(-10,-17,20,13);
  g.fillStyle='#3d4150'; g.fillRect(-10,-17,20,3);        // headrest bar
  // wheels
  g.strokeStyle='#9aa0ad'; g.lineWidth=2;
  g.beginPath(); g.arc(-6,-4,6.5,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(8,-3,3.5,0,Math.PI*2); g.stroke();
  g.fillStyle='#5a6070'; g.beginPath(); g.arc(-6,-4,2,0,Math.PI*2); g.fill();
  // control panel
  g.fillStyle=P.accent; g.fillRect(9,-12,2,3);
}

// Touch attack buttons
const touchState = { left:false,right:false,up:false,punch:false,kick:false,special:false,block:false };
function bindBtn(id, key){
  const el = document.getElementById(id);
  const on = (e)=>{ e.preventDefault(); touchState[key]=true; el.classList.add('press'); queueEdge(key); };
  const off = (e)=>{ e.preventDefault(); touchState[key]=false; el.classList.remove('press'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

// ---- Floating analog joystick (left side) ----
// Touch anywhere in the zone: that point becomes the stick centre. Slide to steer;
// push up (or up-diagonal) past the jump threshold to jump — solves one-thumb diagonal jumps.
const joy = { active:false, id:null, cx:0, cy:0, upWas:false };
const joyzone = document.getElementById('joyzone');
const joybase = document.getElementById('joybase');
const joythumb = document.getElementById('joythumb');
const DEAD = 14;      // px dead-zone for left/right
let JUMP_THRESH = 30; // px upward to trigger a jump (scaled to screen at runtime)

function joyStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  joy.active=true; joy.id = t.identifier!==undefined ? t.identifier : 'mouse';
  const r = joyzone.getBoundingClientRect();
  joy.cx = t.clientX; joy.cy = t.clientY;
  JUMP_THRESH = Math.max(26, r.height*0.16);
  joybase.style.left = (t.clientX - r.left - joybase.offsetWidth/2)+'px';
  joybase.style.bottom = (r.bottom - t.clientY - joybase.offsetHeight/2)+'px';
  joybase.classList.add('on');
  joyMove(e);
}
function joyMove(e){
  if(!joy.active) return;
  let t = null;
  if(e.changedTouches){ for(const c of e.changedTouches) if(c.identifier===joy.id) t=c; }
  else t = e;
  if(!t) return;
  const dx = t.clientX - joy.cx, dy = t.clientY - joy.cy;
  touchState.left  = dx < -DEAD;
  touchState.right = dx >  DEAD;
  const up = dy < -JUMP_THRESH;
  if(up && !joy.upWas) queueEdge('up');   // edge-trigger jump
  joy.upWas = up;
  touchState.up = up;
  // clamp thumb visual
  const mag = Math.min(1, Math.hypot(dx,dy)/ (JUMP_THRESH*1.6));
  const ang = Math.atan2(dy,dx);
  const rad = joybase.offsetWidth*0.32;
  joythumb.style.left = 'calc(50% + '+(Math.cos(ang)*rad*mag)+'px)';
  joythumb.style.top  = 'calc(50% + '+(Math.sin(ang)*rad*mag)+'px)';
}
function joyEnd(e){
  if(e && e.changedTouches){ let match=false; for(const c of e.changedTouches) if(c.identifier===joy.id) match=true; if(!match) return; }
  joy.active=false; joy.id=null; joy.upWas=false;
  touchState.left=touchState.right=touchState.up=false;
  joybase.classList.remove('on');
  joythumb.style.left='50%'; joythumb.style.top='50%';
}
joyzone.addEventListener('touchstart', e=>{ e.preventDefault(); joyStart(e); }, {passive:false});
joyzone.addEventListener('touchmove',  e=>{ e.preventDefault(); joyMove(e); }, {passive:false});
joyzone.addEventListener('touchend',   e=>{ e.preventDefault(); joyEnd(e); }, {passive:false});
joyzone.addEventListener('touchcancel',e=>{ e.preventDefault(); joyEnd(e); }, {passive:false});
joyzone.addEventListener('mousedown', e=>{ joyStart(e); });
addEventListener('mousemove', e=>{ if(joy.id==='mouse') joyMove(e); });
addEventListener('mouseup',   e=>{ if(joy.id==='mouse') joyEnd(e); });

// ---- Gamepad (AYN Thor, Xbox/USB/BT controllers) ----
// Standard mapping: A=punch B=kick X=special Y/RB=jump; D-pad or stick = move; Up/Y = jump; LB/RB=block.
const padState = { left:false,right:false,up:false,punch:false,kick:false,special:false,block:false };
const padPrev = {};
let gamepadOn = false;
addEventListener('gamepadconnected', ()=>{ gamepadOn=true; controlsEl.classList.add('gamepad'); });
addEventListener('gamepaddisconnected', ()=>{ if(!navigator.getGamepads || ![...navigator.getGamepads()].some(Boolean)){ gamepadOn=false; controlsEl.classList.remove('gamepad'); } });

function pollGamepad(){
  if(!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  let gp=null; for(const p of pads){ if(p){ gp=p; break; } }
  if(!gp){ padState.left=padState.right=padState.up=padState.punch=padState.kick=padState.special=padState.block=false; return; }
  if(!gamepadOn){ gamepadOn=true; controlsEl.classList.add('gamepad'); }
  const b = gp.buttons, ax = gp.axes;
  const B = i => b[i] && b[i].pressed;
  const axX = ax[0]||0, axY = ax[1]||0;
  padState.left  = B(14) || axX < -0.45;
  padState.right = B(15) || axX >  0.45;
  const jump = B(12) || B(3) || axY < -0.6;   // dpad-up, Y, or stick up
  padState.up = jump;
  padState.block = B(4) || B(5) || B(6) || B(7);   // shoulders/triggers
  // edge-triggered actions
  const edge = (idx,val,key)=>{ if(val && !padPrev[idx]) queueEdge(key); padPrev[idx]=val; };
  edge('A', B(0), 'punch');
  edge('B', B(1), 'kick');
  edge('X', B(2), 'special');
  edge('J', jump, 'up');
  // held state for punch/kick lets the AI-style repeat feel; keep them momentary via edges only
  padState.punch = false; padState.kick = false; padState.special = false;
  // menu navigation with the pad
  if(mode!=='fight'){
    if((B(0)||B(9)) && !padPrev._start){ advanceScreenClick(); if(mode==='select') padSelectConfirm(); }
    padPrev._start = B(0)||B(9);
    const lr = (B(15)||axX>0.45?1:0) - (B(14)||axX<-0.45?1:0);
    if(lr && !padPrev._lr){ padSelectMove(lr); } padPrev._lr = lr;
  }
}

function resolveInput(){
  input.left   = KEYS.left||touchState.left||padState.left;
  input.right  = KEYS.right||touchState.right||padState.right;
  input.up     = KEYS.up||touchState.up||padState.up;
  input.punch  = KEYS.punch||touchState.punch;
  input.kick   = KEYS.kick||touchState.kick;
  input.special= KEYS.special||touchState.special;
  input.block  = KEYS.block||touchState.block||padState.block;
}

/* ---------------- Match / round flow ---------------- */
function startMatch(){
  round=1; wins={p1:0,p2:0};
  screensEl.classList.add('hidden');
  controlsEl.style.display='block';
  startRound();
}
function startRound(){
  players = [ makePlayer(pick.p1,'p1',false), makePlayer(pick.p2,'p2',true) ];
  projectiles=[]; particles=[];
  roundTimer=60; roundTimerFrames=0;
  mode='fight';
  announce = { text:'ROUND '+round, t:70, sub:'FIGHT!' };
  freeze = 40; // brief intro freeze
}
let freeze = 0;
function endRound(winnerSide, reason){
  mode='roundover';
  if(winnerSide) wins[winnerSide]++;
  const p1w=wins.p1, p2w=wins.p2;
  let over = (p1w>=2 || p2w>=2);
  const winnerData = winnerSide==='p1'?FIGHTERS[pick.p1]:(winnerSide==='p2'?FIGHTERS[pick.p2]:null);
  announce = { text: winnerSide? (winnerData.name.split(' ').pop()+' WINS') : 'DRAW', t:9999, sub: reason||'' };
  setTimeout(()=>{
    if(over){ showMatchOver(); }
    else { round++; startRound(); }
  }, 2200);
}
function showMatchOver(){
  mode='matchover';
  controlsEl.style.display='none';
  screensEl.classList.remove('hidden');
  const youWon = wins.p1>wins.p2;
  let unlocked = null;
  if(youWon) unlocked = recordWinAndCheckUnlock();
  const remaining = SECRET_ORDER.length - secretsUnlockedCount();
  let unlockHtml = '';
  if(unlocked){
    unlockHtml = `<div class="unlock-banner">🔓 NEW SECRET SCIENTIST UNLOCKED!<br><b>${unlocked.name}</b> — ★ ${unlocked.special.name}</div>`;
  } else if(youWon && remaining>0){
    unlockHtml = `<p class="sub" style="margin-top:0">Win ${remaining} more match${remaining>1?'es':''} to reveal the next secret scientist.</p>`;
  }
  screensEl.innerHTML = `
    <h1 class="title" style="font-size:6.5vh">${youWon?'YOU WIN!':'YOU LOSE'}</h1>
    <p class="sub">${wins.p1} – ${wins.p2}. ${youWon?'Science prevails. 🧪':'The CPU out-experimented you. Try another fighter?'}</p>
    ${unlockHtml}
    <button class="big-btn" id="againBtn">CHOOSE FIGHTER</button>
    <button class="ghost-btn" id="menuBtn">Main Menu</button>
  `;
  document.getElementById('againBtn').onclick = showSelect;
  document.getElementById('menuBtn').onclick = showMenu;
}

  if(mode==='menu') showSelect();

/* ---------------- Combat helpers ---------------- */
function startAttack(p, type){
  if(p.hitstun>0) return false;
  if(p.state==='attack' || p.state==='special' || p.state==='hitstun') return false;
  p.state='attack'; p.attackType=type; p.attackFrame=0; p.hasHit=false; p.vx=0;
  return true;
}
function startSpecial(p){
  if(p.hitstun>0 || p.specialCD>0) return false;
  if(p.state==='attack'||p.state==='special') return false;
  p.state='special'; p.attackFrame=0; p.specialCD=95; p.vx=0;
  return true;
}
function spawnProjectile(p){
  const sp = p.data.special;
  const dir = p.facing;
  projectiles.push({
    owner:p.side, x:p.x+dir*22, y:p.y-30, vx:dir*sp.speed, dir,
    kind:sp.kind, color:sp.color, dmg:sp.dmg, label:sp.label, life:150, t:0, r:10
  });
  // flash particles
  for(let i=0;i<10;i++) particles.push({x:p.x+dir*20,y:p.y-30,vx:dir*(1+Math.random()*2),vy:(Math.random()-0.5)*3,life:16,c:sp.color});
  screenShake=4;
}

let screenShake=0;

function facingToward(p, o){ return o.x>=p.x?1:-1; }

function applyHit(att, def, dmg, kb, launch, chip){
  // blocking check: must hold block AND face attacker
  const facingAtt = (att.x - def.x)>0 ? 1 : -1;
  const blocking = def.blockHold && def.facing===facingAtt && def.onGround && def.state!=='attack' && def.state!=='special';
  if(blocking){
    const bd = Math.max(1, Math.round(chip!==undefined?chip:dmg*0.2));
    def.health-=bd;
    def.vx = facingAtt*-1 * 1.4;
    def.hitFlash=5;
    for(let i=0;i<6;i++) particles.push({x:def.x - facingAtt*10,y:def.y-30,vx:-facingAtt*(1+Math.random()),vy:(Math.random()-1)*2,life:12,c:'#bcdcff'});
    return;
  }
  def.health-=dmg;
  def.hitstun = 12 + Math.round(dmg);
  def.state='hitstun';
  def.vx = -facingAtt*kb;
  if(launch){ def.vy=-launch; def.onGround=false; }
  def.hitFlash=8;
  def.facing = facingAtt; // face the hit
  // hit sparks + blood-free "energy" pop
  for(let i=0;i<12;i++) particles.push({x:def.x - facingAtt*8,y:def.y-32,vx:-facingAtt*(1+Math.random()*2.5),vy:(Math.random()-1)*3,life:18,c:i%2?'#fff':'#ffd34a'});
  hitStop = 5; screenShake=Math.min(9,4+dmg*0.3);
}
let hitStop=0;

/* ---------------- AI ---------------- */
function updateAI(p, o){
  const ai=p.ai;
  const dist = Math.abs(o.x-p.x);
  ai.decisionT--;
  // reset per-frame virtual input
  const vin={left:false,right:false,up:false,punch:false,kick:false,special:false,block:false};
  p.facing = facingToward(p,o);

  if(p.hitstun>0){ p._vin=vin; return; }

  // occasionally decide a new behavior
  if(ai.decisionT<=0){
    ai.decisionT = 12 + Math.floor(Math.random()*24);
    const r=Math.random();
    if(dist>150){
      ai.action = (p.specialCD<=0 && r<0.4) ? 'special' : 'approach';
    } else if(dist>60){
      ai.action = r<0.6 ? 'approach' : (r<0.8?'jumpin':'wait');
    } else {
      // in range
      if(r<0.42) ai.action='attack';
      else if(r<0.58) ai.action='block';
      else if(r<0.72) ai.action='retreat';
      else ai.action='attack';
    }
    ai.actT = 10+Math.floor(Math.random()*18);
  }
  ai.actT--;

  switch(ai.action){
    case 'approach': if(o.x>p.x) vin.right=true; else vin.left=true; break;
    case 'retreat':  if(o.x>p.x) vin.left=true; else vin.right=true; if(Math.random()<0.5)vin.block=true; break;
    case 'wait':     if(Math.random()<0.6)vin.block=true; break;
    case 'jumpin':   vin.up=true; if(o.x>p.x)vin.right=true; else vin.left=true; break;
    case 'block':    vin.block=true; break;
    case 'special':  if(p.specialCD<=0){ vin.special=true; ai.action='approach'; } break;
    case 'attack':
      if(dist<52){ if(Math.random()<0.5) vin.punch=true; else vin.kick=true; }
      else { if(o.x>p.x) vin.right=true; else vin.left=true; }
      break;
  }
  // difficulty scaling by round
  if(round>=2 && Math.random()<0.02 && p.specialCD<=0 && dist>90) vin.special=true;
  p._vin=vin;
}

/* ---------------- Per-frame update ---------------- */
function updatePlayer(p, o, humanInput){
  // gather input
  let in_;
  if(p.isAI){ in_ = p._vin || {}; }
  else { in_ = humanInput; }

  // timers
  if(p.hitFlash>0)p.hitFlash--;
  if(p.specialCD>0)p.specialCD--;
  if(p.hitstun>0){ p.hitstun--; if(p.hitstun===0 && p.onGround){ p.state='idle'; } }

  p.blockHold = !!in_.block && p.onGround;

  // face opponent when idle-ish and grounded
  const canAct = p.hitstun<=0 && p.state!=='attack' && p.state!=='special';

  // ---- action starts (edge for human handled via 'pressed', AI via virtual press) ----
  if(canAct && p.onGround){
    if(p.isAI){
      if(in_.special) startSpecial(p);
      else if(in_.punch) startAttack(p,'punch');
      else if(in_.kick) startAttack(p,'kick');
    } else {
      if(pressed.special) startSpecial(p);
      else if(pressed.punch) startAttack(p,'punch');
      else if(pressed.kick) startAttack(p,'kick');
    }
  }

  // ---- movement ----
  const SPD=2.4;
  if(canAct){
    if(p.onGround){
      if(!p.blockHold){
        if(in_.left){ p.vx=-SPD; }
        else if(in_.right){ p.vx=SPD; }
        else p.vx=0;
        // jump
        const jump = p.isAI ? in_.up : (pressed.up||in_.up);
        if(jump && p.onGround){ p.vy=-9.4; p.onGround=false; p.state='jump'; }
      } else { p.vx=0; }
    } else {
      // air control
      if(in_.left) p.vx=-SPD*0.9; else if(in_.right) p.vx=SPD*0.9;
    }
    // face movement/opponent while free
    if(p.onGround && !in_.left && !in_.right){ p.facing = facingToward(p,o); }
    else if(!p.isAI){ /* keep facing set by movement dir for feel */ p.facing = facingToward(p,o); }
  }

  // ---- attack progression ----
  if(p.state==='attack'){
    const A=ATTACKS[p.attackType]; p.attackFrame++;
    const f=p.attackFrame;
    if(f>=A.startup && f<A.startup+A.active && !p.hasHit){
      // hitbox in front
      const hx = p.x + p.facing*(A.reach);
      const hy = p.y-32;
      if(Math.abs(o.x - hx) < (A.range*0.5+14) && Math.abs((o.y-32)-hy)<28 && o.hitstun<=0){
        // check o is in front
        if((o.x-p.x)*p.facing>0 || Math.abs(o.x-p.x)<24){
          applyHit(p,o,A.dmg,A.kb,A.launch);
          p.hasHit=true;
        }
      }
    }
    if(f>=A.startup+A.active+A.recovery){ p.state = p.onGround?'idle':'jump'; p.attackType=null; }
  }
  else if(p.state==='special'){
    p.attackFrame++;
    if(p.attackFrame===10){ spawnProjectile(p); }
    if(p.attackFrame>=26){ p.state=p.onGround?'idle':'jump'; }
  }

  // ---- physics ----
  p.x += p.vx;
  p.y += p.vy;
  if(!p.onGround){ p.vy += GRAV; }
  if(p.y>=GROUND){ p.y=GROUND; p.vy=0; if(!p.onGround){ p.onGround=true; if(p.state==='jump') p.state='idle'; } }
  // walls
  p.x = Math.max(40, Math.min(VW-40, p.x));

  // simple push-apart so they don't overlap
  const gap = Math.abs(p.x-o.x);
  if(gap<34 && p.onGround && o.onGround){
    const push=(34-gap)/2;
    if(p.x<o.x){ p.x-=push; } else { p.x+=push; }
  }

  // ---- build pose for rendering ----
  buildPose(p, in_);
}

function buildPose(p, in_){
  const pose={ legSpread:4 };
  if(p.state==='attack'){
    if(p.attackType==='punch'){ pose.punch=true; }
    else { pose.legLift = 8; } // kick
  } else if(p.state==='special'){ pose.special=true; }
  else if(p.state==='hitstun'){ pose.lean=true; }
  else if(p.blockHold){ pose.block=true; pose.legSpread=6; }
  else if(!p.onGround){ pose.legSpread=2; pose.crouch=4; }
  else if(Math.abs(p.vx)>0.2){ pose.legSpread = (Math.floor(gameFrame/6)%2)?6:2; } // walk cycle
  p.pose = pose;
}

/* ---------------- Particles / projectiles ---------------- */
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i]; pr.t++;
    pr.x+=pr.vx;
    if(pr.kind==='apple'){ pr.vy=(pr.vy||0)+0.12; pr.y+=pr.vy; }
    if(pr.kind==='hole'){ pr.vx*=0.985; }
    if(pr.kind==='orbit'){ pr.y += Math.sin(pr.t*0.14)*0.9; }      // gentle orbital arc
    if(pr.kind==='cards'){ pr.y += Math.sin(pr.t*0.2)*0.5; }       // fluttering cards
    pr.life--;
    // trail
    if(pr.t%2===0) particles.push({x:pr.x,y:pr.y,vx:0,vy:0,life:10,c:pr.color,fade:true});
    // hit target
    const target = pr.owner==='p1'?players[1]:players[0];
    if(target && Math.abs(target.x-pr.x)<24 && Math.abs((target.y-30)-pr.y)<34 && target.hitstun<=0){
      const att = pr.owner==='p1'?players[0]:players[1];
      applyHit(att, target, pr.dmg, 4.5, 3);
      for(let k=0;k<16;k++) particles.push({x:pr.x,y:pr.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20,c:pr.color});
      projectiles.splice(i,1); continue;
    }
    if(pr.x<10||pr.x>VW-10||pr.life<=0) projectiles.splice(i,1);
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i]; q.x+=q.vx; q.y+=q.vy; if(!q.fade)q.vy+=0.12; q.life--;
    if(q.life<=0) particles.splice(i,1);
  }
}

/* ---------------- Rendering ---------------- */
let gameFrame=0;
function drawBackground(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#1a1030'); g.addColorStop(0.5,'#241a44'); g.addColorStop(1,'#12102a');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // lab background: shelves, flasks, formulae
  ctx.fillStyle='rgba(255,255,255,0.04)';
  for(let i=0;i<7;i++){ ctx.fillRect(30+i*90, 40+((i*37)%60), 60, 3); }
  // floating formulae
  ctx.font='12px monospace'; ctx.fillStyle='rgba(150,180,255,0.10)';
  const forms=['E=mc²','F=ma','∇·E=ρ/ε₀','λ=h/p','a²+b²=c²','S=k logW','∫F·dx'];
  for(let i=0;i<forms.length;i++){
    ctx.fillText(forms[i], (i*97+ (gameFrame*0.2))%VW, 60+ (i*33)%150);
  }
  // big glowing reaction orbs
  for(let i=0;i<3;i++){
    const ox=120+i*200, oy=110+Math.sin((gameFrame*0.02)+i)*10;
    const rg=ctx.createRadialGradient(ox,oy,2,ox,oy,40);
    rg.addColorStop(0,['rgba(120,200,255,0.12)','rgba(160,255,180,0.10)','rgba(200,140,255,0.11)'][i]);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(ox-40,oy-40,80,80);
  }
  // floor
  ctx.fillStyle='#0d0b1a'; ctx.fillRect(0,GROUND,VW,VH-GROUND);
  ctx.fillStyle='#191634'; ctx.fillRect(0,GROUND,VW,4);
  // floor tiles perspective
  ctx.strokeStyle='rgba(120,120,200,0.10)'; ctx.lineWidth=1;
  for(let i=0;i<=12;i++){ const x=(i/12)*VW; ctx.beginPath(); ctx.moveTo(VW/2+(x-VW/2)*1.0, GROUND); ctx.lineTo(VW/2+(x-VW/2)*2.2, VH); ctx.stroke(); }
}

function drawProjectiles(){
  for(const pr of projectiles){
    ctx.save();
    const glow=ctx.createRadialGradient(pr.x,pr.y,1,pr.x,pr.y,pr.r+8);
    glow.addColorStop(0,pr.color); glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r+8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=pr.color;
    if(pr.kind==='bolt'){
      // jagged lightning
      ctx.strokeStyle=pr.color; ctx.lineWidth=3; ctx.beginPath();
      let x=pr.x-pr.dir*14, y=pr.y-6;
      ctx.moveTo(x,y);
      for(let s=0;s<4;s++){ x+=pr.dir*7; y+= (s%2?6:-6); ctx.lineTo(x,y); }
      ctx.stroke();
    } else if(pr.kind==='apple'){
      ctx.beginPath(); ctx.arc(pr.x,pr.y,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#5a3a1a'; ctx.fillRect(pr.x-1,pr.y-9,2,4);
      ctx.fillStyle='#6bd06b'; ctx.fillRect(pr.x+1,pr.y-9,4,2);
    } else if(pr.kind==='hole'){
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=pr.color; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r+3+Math.sin(pr.t*0.3)*2,0,Math.PI*2); ctx.stroke();
    } else if(pr.kind==='helix'){
      // rotating DNA double helix
      ctx.lineWidth=2;
      for(let s=0;s<2;s++){
        ctx.strokeStyle = s? '#8fd6ff' : pr.color; ctx.beginPath();
        for(let i=0;i<=12;i++){ const xx=pr.x-7+i*1.2, ph=i*0.7+pr.t*0.35+s*Math.PI; if(i===0)ctx.moveTo(xx,pr.y+Math.sin(ph)*5); else ctx.lineTo(xx,pr.y+Math.sin(ph)*5); }
        ctx.stroke();
      }
      ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1;
      for(let i=0;i<=12;i+=3){ const ph=i*0.7+pr.t*0.35; ctx.beginPath(); ctx.moveTo(pr.x-7+i*1.2,pr.y+Math.sin(ph)*5); ctx.lineTo(pr.x-7+i*1.2,pr.y+Math.sin(ph+Math.PI)*5); ctx.stroke(); }
    } else if(pr.kind==='orbit'){
      // planet slingshotting around a focus
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(pr.x,pr.y,10,5,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#ffd36b'; ctx.beginPath(); ctx.arc(pr.x,pr.y,2.2,0,Math.PI*2); ctx.fill();
      const a=pr.t*0.45, ox=pr.x+Math.cos(a)*10, oy=pr.y+Math.sin(a)*5;
      ctx.fillStyle=pr.color; ctx.beginPath(); ctx.arc(ox,oy,3,0,Math.PI*2); ctx.fill();
    } else if(pr.kind==='cards'){
      // stream of punch cards
      for(let i=0;i<3;i++){ const yy=pr.y-5+i*4+Math.sin(pr.t*0.3+i)*1.5;
        ctx.fillStyle=i%2?'#fff':pr.color; ctx.fillRect(pr.x-5-i*2, yy, 8, 4);
        ctx.fillStyle='#333'; ctx.fillRect(pr.x-4-i*2,yy+1,1,1); ctx.fillRect(pr.x-1-i*2,yy+2,1,1); ctx.fillRect(pr.x+1-i*2,yy+1,1,1); }
    } else if(pr.kind==='cipher'){
      // scrolling cipher glyphs
      const chars='01ΞΨΣ⊕Δ'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
      for(let i=0;i<4;i++){ ctx.fillStyle= i? 'rgba(141,255,158,0.75)' : pr.color;
        ctx.fillText(chars[(pr.t+i)%chars.length], pr.x-5+i*3.3, pr.y+((pr.t*2+i*5)%12)-6); }
      ctx.textAlign='left';
    } else if(pr.kind==='star'){
      // comet with tail
      ctx.strokeStyle=pr.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(pr.x-pr.dir*13,pr.y); ctx.lineTo(pr.x,pr.y); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pr.x,pr.y,3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=pr.color; ctx.lineWidth=1.5; ctx.beginPath();
      ctx.moveTo(pr.x-5,pr.y); ctx.lineTo(pr.x+5,pr.y); ctx.moveTo(pr.x,pr.y-5); ctx.lineTo(pr.x,pr.y+5); ctx.stroke();
    } else if(pr.kind==='deathray'){
      // concentrated burning-mirror beam
      ctx.fillStyle=pr.color; ctx.globalAlpha=0.5; ctx.fillRect(pr.x-9,pr.y-3,18,6); ctx.globalAlpha=1;
      ctx.fillStyle=pr.color; ctx.fillRect(pr.x-9,pr.y-2,18,4);
      ctx.fillStyle='#fff'; ctx.fillRect(pr.x-9,pr.y-1,18,2);
    } else {
      ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
      ctx.fillText(pr.label, pr.x, pr.y+3);
    }
    ctx.restore();
  }
  ctx.textAlign='left';
}
function drawParticles(){
  for(const q of particles){ ctx.fillStyle=q.c; const s=q.fade?3:2; ctx.fillRect(q.x-s/2,q.y-s/2,s,s); }
}

function drawHUD(){
  // health bars
  drawHealthBar(20, 16, 250, players[0], false);
  drawHealthBar(VW-20-250, 16, 250, players[1], true);
  // names
  ctx.font='bold 12px "Trebuchet MS",sans-serif'; ctx.fillStyle='#fff';
  ctx.textAlign='left'; ctx.fillText(players[0].data.name, 20, 46);
  ctx.textAlign='right'; ctx.fillText(players[1].data.name, VW-20, 46);
  ctx.textAlign='center';
  // round pips
  for(let i=0;i<2;i++){ ctx.fillStyle=wins.p1>i?'#ffd34a':'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(20+8+i*16,54,4,0,7); ctx.fill(); }
  for(let i=0;i<2;i++){ ctx.fillStyle=wins.p2>i?'#ffd34a':'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(VW-20-8-i*16,54,4,0,7); ctx.fill(); }
  // timer
  ctx.fillStyle='#0a0a14'; ctx.fillRect(VW/2-26,12,52,30);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.strokeRect(VW/2-26,12,52,30);
  ctx.font='bold 22px monospace'; ctx.fillStyle= roundTimer<=10?'#ff6060':'#fff';
  ctx.fillText(Math.ceil(roundTimer), VW/2, 35);
  // special cooldown pips under names
  drawCD(players[0], 20, 60, false);
  drawCD(players[1], VW-20, 60, true);
  ctx.textAlign='left';
}
function drawCD(p, x, y, right){
  const ready = p.specialCD<=0;
  ctx.font='10px "Trebuchet MS",sans-serif';
  ctx.fillStyle = ready?p.data.special.color:'rgba(255,255,255,0.28)';
  ctx.textAlign = right?'right':'left';
  ctx.fillText('★ '+(ready?'SCIENCE READY':'charging…'), x, y);
}
function drawHealthBar(x,y,w,p,flip){
  const frac=Math.max(0,p.health)/p.maxHealth;
  ctx.fillStyle='#000'; ctx.fillRect(x-2,y-2,w+4,18);
  ctx.fillStyle='#3a1015'; ctx.fillRect(x,y,w,14);
  const bw=w*frac;
  const g=ctx.createLinearGradient(0,y,0,y+14);
  g.addColorStop(0,'#ffe36b'); g.addColorStop(0.5,'#ff9a3c'); g.addColorStop(1,'#ff4d4d');
  ctx.fillStyle=g;
  if(flip) ctx.fillRect(x+w-bw,y,bw,14); else ctx.fillRect(x,y,bw,14);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.strokeRect(x,y,w,14);
}

function drawAnnounce(){
  if(announce.t<=0 && mode==='fight') return;
  if(announce.text){
    ctx.save(); ctx.textAlign='center';
    const big = mode!=='fight' ? 34 : (announce.t>40?26:26);
    ctx.font='900 '+big+'px "Trebuchet MS",sans-serif';
    ctx.lineWidth=5; ctx.strokeStyle='#000'; ctx.fillStyle='#ffd34a';
    ctx.strokeText(announce.text, VW/2, VH/2-6);
    ctx.fillText(announce.text, VW/2, VH/2-6);
    if(announce.sub){ ctx.font='900 16px "Trebuchet MS",sans-serif'; ctx.fillStyle='#fff';
      ctx.strokeText(announce.sub, VW/2, VH/2+18); ctx.fillText(announce.sub, VW/2, VH/2+18); }
    ctx.restore(); ctx.textAlign='left';
  }
}

/* ---------------- Main loop ---------------- */
function loop(){
  requestAnimationFrame(loop);
  gameFrame++;
  pollGamepad();
  resolveInput();

  if(mode==='fight' || mode==='roundover'){
    // hit-stop / intro freeze
    let sim = true;
    if(freeze>0){ freeze--; sim=false; if(announce.t>0)announce.t--; }
    if(hitStop>0){ hitStop--; sim=false; }

    if(sim && mode==='fight'){
      // AI decisions first
      updateAI(players[1], players[0]);
      updatePlayer(players[0], players[1], input);
      updatePlayer(players[1], players[0], null);
      updateProjectiles();
      updateParticles();

      // timer
      roundTimerFrames++;
      if(roundTimerFrames>=60){ roundTimerFrames=0; roundTimer--; }

      // round end conditions
      if(announce.t>0) announce.t--;
      if(players[0].health<=0 && players[1].health<=0) endRound(null,'DOUBLE K.O.');
      else if(players[0].health<=0) endRound('p2','K.O.');
      else if(players[1].health<=0) endRound('p1','K.O.');
      else if(roundTimer<=0){
        if(players[0].health>players[1].health) endRound('p1','TIME UP');
        else if(players[1].health>players[0].health) endRound('p2','TIME UP');
        else endRound(null,'DRAW');
      }
    } else {
      updateParticles(); updateProjectiles();
    }

    // ---- render ----
    ctx.save();
    if(screenShake>0){ ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake); screenShake*=0.85; if(screenShake<0.4)screenShake=0; }
    drawBackground();
    // draw fighters (sorted so front one overlaps naturally is minor; draw both)
    drawShadow(players[0]); drawShadow(players[1]);
    drawFighter(players[0]); drawFighter(players[1]);
    drawProjectiles();
    drawParticles();
    ctx.restore();
    drawHUD();
    drawAnnounce();
  }

  // clear extra edge flags each frame end
  pressed.punch=pressed.kick=pressed.special=pressed.up=false;
}
function drawShadow(p){
  ctx.fillStyle='rgba(0,0,0,0.35)';
  const w = p.onGround?24:16;
  ctx.beginPath(); ctx.ellipse(p.x, GROUND+2, w/2, 4, 0,0,Math.PI*2); ctx.fill();
}

/* ---------------- Orientation handling ---------------- */
function checkOrient(){
  const rot=document.getElementById('rotate');
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  rot.style.display = (portrait && touch) ? 'flex' : 'none';
}
addEventListener('resize', checkOrient);
addEventListener('orientationchange', ()=>setTimeout(checkOrient,200));

// fit canvas CSS handled by CSS (absolute inset:0). Ensure crisp.
window.addEventListener('load', ()=>{ checkOrient(); showMenu(); loop(); });
// start immediately too (in case load already fired)
checkOrient(); showMenu();

// Prevent iOS double-tap zoom / scroll
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
</script>
